  "10-17": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>허위 진술 대가 약정은 정의 관념에 반하여 무효입니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>ㄴ. 허위표시(108조) 문제이지 반사회질서 행위는 아닙니다.<br>ㄷ. 임명행위 자체는 종교 내부의 행위로 반사회질서로 보지 않았습니다.</div>",
  "10-18": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>민법 제153조 제1항에 따라 기한은 채무자의 이익을 위한 것으로 추정됩니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 상계는 단독행위이므로 원칙적으로 조건을 붙일 수 없습니다.<br>② 불법조건이 붙으면 법률행위 전체가 무효입니다.<br>③ 불능조건이 해제조건이면 조건 없는 법률행위(유효)가 됩니다.<br>④ 시기 있는 행위는 도래한 때부터 효력이 발생합니다.</div><div class='exp-section' style='background:#f4f7ff; border:1px solid #ccd5ff; padding:10px; border-radius:5px;'><div style='margin-bottom:8px; font-weight:bold;'>📍 [시기 있는 행위 vs 정지조건] 핵심 요약</div><table style='width:100%; border-collapse:collapse; font-size:0.85em; text-align:center; background:white;' border='1'><thead><tr style='background:#e6ecff;'><th style='padding:5px;'>구분</th><th style='padding:5px;'>의미</th><th style='padding:5px;'>효력 발생 시점</th><th style='padding:5px;'>확실성</th></tr></thead><tbody><tr><td style='padding:5px;'><strong>시기(始期)</strong></td><td style='padding:5px;'>시작하는 기한</td><td style='padding:5px;'>기한 도달 시<b>부터</b></td><td style='padding:5px;'><b>확실함</b></td></tr><tr><td style='padding:5px;'><strong>종기(終期)</strong></td><td style='padding:5px;'>마치는 기한</td><td style='padding:5px;'>기한 도달 시<b>까지</b></td><td style='padding:5px;'><b>확실함</b></td></tr><tr><td style='padding:5px;'><strong>정지조건</strong></td><td style='padding:5px;'>효력 발생 조건</td><td style='padding:5px;'>조건 성취 시<b>부터</b></td><td style='padding:5px; color:orange;'>불확실함</td></tr></tbody></table></div>",
  "10-19": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>타인의 권리 매매도 유효하며, 매도인은 그 권리를 취득하여 이전할 의무를 집니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 비진의표시는 원칙적으로 유효입니다.<br>② 무효와 취소는 경합할 수 있으므로 무효인 행위도 취소 가능합니다.<br>③ 무효는 누구든지 주장할 수 있는 것이 원칙입니다.<br>⑤ 무효인 행위는 기간 제한 없이 추인(새로운 계약)이 가능합니다.</div>",
  "10-20": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>상대방이 양도한 것은 추인이 아닙니다. 취소권자가 양도해야 법정추인이 됩니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>①~④는 모두 취소권자가 능동적으로 행동한 경우로 추인으로 간주됩니다.</div>",
  "10-21": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>기간의 초일은 공휴일이라도 산입하며, 기간의 만료일이 공휴일인 경우에만 익일로 종료합니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 연령 계산은 예외적으로 초일 산입입니다.<br>③ 단기 기간은 즉시 기산합니다.<br>④ 역에 의한 계산 원칙입니다.<br>⑤ 초일 불산입 원칙의 예외(0시 시작)입니다.</div>",
  "10-22": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>시효 이익은 포기할 수 있으나, 제척기간은 강행규정적 성격이 강해 포기가 인정되지 않습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 둘 다 기간 만료 시 권리가 소멸합니다.<br>② 제척기간은 중단/정지 제도가 없습니다.<br>④ 제척기간이 직권조사 사항이고, 소멸시효는 당사자가 주장해야 합니다.<br>⑤ 두 기간은 병존하며 각각 적용됩니다.</div>",
  "10-23": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>판결로 확정된 채권은 원래 단기시효라도 10년으로 연장됩니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>①, ②, ④, ⑤는 모두 민법 제164조에 규정된 1년의 단기소멸시효 채권입니다.</div>",
  "10-24": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>매수인이 인도받아 사용 중이면 시효가 진행되지 않으나(ㄴ), 아무 조치 없는 일반 청구권은 진행됩니다(ㄱ).</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>ㄷ. 소유권에 기한 물권적 청구권은 소멸시효에 걸리지 않습니다.</div><div class='exp-section' style='background:#f9f9f9; border-top:1px dashed #ccc; padding-top:10px;'><table style='width:100%; border-collapse:collapse; font-size:0.85em; text-align:center;' border='1'><thead><tr style='background:#eee;'><th>지문</th><th>성격</th><th>시효</th><th>핵심</th></tr></thead><tbody><tr><td>ㄱ</td><td>채권적</td><td style='color:red;'>진행</td><td>점유X</td></tr><tr><td>ㄴ</td><td>채권적</td><td>중단</td><td>점유O</td></tr><tr><td>ㄷ</td><td>물권적</td><td>X</td><td>소유권</td></tr></tbody></table></div>",
  "10-25": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>계약 해제 후에도 착오가 있다면 취소하여 해제에 따른 불이익(손해배상 등)을 면할 수 있습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 무효 시 서로 반환해야 합니다.<br>② 제한능력자는 현존 이익만 반환합니다.<br>④ 취소에 따른 원상회복은 동시이행 관계입니다.<br>⑤ 유동적 무효 상태에서는 계약금 반환 청구가 불가합니다.</div>",

  "11-1": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>① 법원이 선임한 재산관리인은 관리행위(보존, 이용, 개량행위)는 허가 없이 할 수 있습니다. 처분행위를 할 때만 법원의 허가가 필요합니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>②, ③, ④ 민법 제24조 내지 제26조의 명문 규정입니다.<br>⑤ 선임결정이 취소되지 않는 한 관리인의 권한은 소멸하지 않는다는 것이 판례의 입장입니다.</div>",
  "11-2": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>① 신의칙이 강행규정(합법성의 원칙)보다 우월할 수는 없습니다. 강행법규를 위반한 자가 스스로 무효를 주장하는 것은 신의칙에 반하지 않습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>③ 숙박업자의 보호의무는 신의칙상 부수적 의무입니다.<br>④ 인지청구권은 포기할 수 없는 권리이므로 실효의 법리가 적용되지 않습니다.<br>⑤ 특정된 채무를 보증한 이사는 사정변경을 이유로 해지할 수 없습니다.</div>",
  "11-3": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>② 실종선고의 효과를 다투려면 반드시 실종선고를 '취소'하여야 합니다. 취소 전까지는 사망으로 간주되므로 단순히 반증만으로는 효과를 다툴 수 없습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 후순위 상속인은 선순위 상속인이 있는 한 이해관계인이 아닙니다.<br>④ 실종기간 만료 시에 사망한 것으로 '본다'(간주)는 점에 주의해야 합니다.</div>",
  "11-4": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>③ 상대방의 철회권은 표의자가 미성년자임을 '몰랐던(선의)' 경우에만 인정됩니다. 丙이 알았다면 철회할 수 없습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>①, ② 제15조에 규정된 상대방의 촉구권 내용입니다.<br>⑤ 미성년자가 속임수(위조 등)로 능력자로 믿게 한 경우 취소권이 박탈됩니다(제17조).</div>",
  "11-5": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>② 성년후견은 '지속적'으로 결여된 사람에게, 한정후견은 '부족'한 사람에게 행해집니다. '일시적' 부족은 성년후견 사유가 아닙니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 본인의 의사를 고려해야 합니다.<br>④ 일상생활 소액 행위는 취소할 수 없습니다.</div>",
  "11-6": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>④ 속임수를 써서 자기를 능력자로 믿게 한 경우에는 취소할 수 없습니다(제17조 제1항).</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 취소된 법률행위는 처음부터(소급하여) 무효가 됩니다.<br>②, ③ 처분이 허락된 재산이나 특정 영업에 대해서는 미성년자도 능력자가 되지만, 법정대리인의 대리권 자체가 소멸하는 것은 아닙니다.</div>",
  "11-7": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>⑤ 대표자의 행위가 직무에 해당하지 않음을 피해자가 중과실로 몰랐다면 책임을 물을 수 없으나, 경과실인 경우에는 법인의 책임을 물을 수 있습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 등기 여부보다 '실질적' 대표자인지가 중요합니다.<br>③ 외형상 직무행위라면 법령 위배 여부와 상관없이 직무행위로 인정될 수 있습니다.</div>",
  "11-8": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>① 비법인사단은 등기할 수 없으므로 대표권 제한 등기 규정이 적용될 여지가 없습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>② 총유물의 매매계약은 처분행위에 해당합니다.<br>④ 보존행위도 구성원 개인이 할 수 없고 주주총회(사원총회) 결의를 거쳐야 합니다.</div>",
  "11-9": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>③ 타인의 토지에 무단으로 심은 수목은 토지소유자에게 부합됩니다(토지 소유자 소유). 심은 자의 소유가 아닙니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>② 주유기는 주유소 건물의 효용을 높이는 종물입니다.<br>⑤ 독립된 건물로 인정되려면 기둥, 지붕, 주벽이 갖춰져야 합니다.</div>",
  "11-10": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>② 관습법도 위헌법률심판의 대상이 될 수 있다는 것이 판례입니다.<br>④ 사실인 관습은 법원이 아니므로 법령과 저촉되지 않더라도 법칙으로서의 효력은 없습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 조약도 민사에 관한 것이면 법원입니다.<br>③ 관습법은 법이므로 법원이 직권으로 확정해야 합니다.</div>",
  "11-11": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>④ 강행규정 위반자가 스스로 무효를 주장하는 것은 신의칙 위반이 아니며, 국가 질서를 위해 허용되어야 한다는 것이 판례입니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>② 무효인 강행법규 위반행위는 추인해도 유효가 되지 않습니다.<br>③ 표현대리 법리는 성립할 수 없습니다.</div>",
  "11-12": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>ㄱ, ㄴ은 설정적 승계취득입니다. ㄷ, ㄹ은 원시취득(유실물 습득, 시효취득)에 해당합니다.</div>",
  "11-13": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>③ 강제집행을 면할 목적의 허위 근저당 설정은 통정허위표시로서 무효일 뿐, 반사회적 법률행위(제103조)는 아닙니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>② 형사사건 성공보수 약정은 반사회적 행위로 무효입니다.<br>④ 적극 가담한 이중매매(증여)는 무효입니다.</div>",
  "11-14": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>⑤ 제3자의 기망행위로 손해를 입은 경우, 계약을 취소하지 않고도 제3자에게 불법행위에 따른 손해배상을 청구할 수 있습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>③ 교환계약에서 시가를 묵비하는 것은 기망이 아닙니다.<br>④ 대리인의 사기는 제3자의 사기가 아닌 '상대방의 사기'와 동일하게 취급됩니다.</div>",
  "11-15": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>③ 당사자의 속뜻(X토지)이 일치했다면 표시(Y토지)와 상관없이 속뜻대로 계약이 성립한다는 '오표시무해의 원칙'은 자연적 해석의 대표적 사례입니다.</div>",
  "11-16": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>⑤ 단순히 채권을 보전하기 위해 대위행사하는 자는 허위표시를 기초로 새로운 법률상 이해관계를 맺은 '제3자'에 해당하지 않습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 통정허위표시도 사해행위취소권의 대상이 됩니다.<br>② 파산관재인이나 가압류권자는 보호받는 제3자입니다.</div>",
  "11-17": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>⑤ 표의자에게 '중대한 과실이 있다는 사실'에 대한 증명책임은 착오자가 아니라, 법률행위를 유지하려는 상대방에게 있습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 경제적 불이익이 없다면 중요부분의 착오가 아닙니다.<br>④ 계약 해제 후에도 착오 취소권을 행사할 수 있다는 것이 유명한 판례입니다.</div>",
  "11-18": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>④ 무권리자의 처분에 대해 권리자가 추인하면 원칙적으로 계약 시로 소급하여 효력이 발생합니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 불공정한 법률행위에는 부제소합의도 무효입니다.<br>② 이행의 청구는 '취소권자'가 해야 추인이 됩니다. 상대방이 청구한 것은 추인이 아닙니다.<br>③ 불공정한 법률행위도 무효행위의 전환(제138조)이 적용될 수 있습니다.</div>",
  "11-19": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>⑤ 조건의사가 있더라도 외부에 표시되지 않으면 단지 동기에 불과하며 법률행위의 조건이 되지 않습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 기한이익 상실 특약은 특별한 사정이 없으면 '형성권적' 특약으로 추정합니다.<br>② 불가능하게 된 때에도 기한은 도래한 것으로 봅니다.<br>④ 기한은 소급효가 절대로 인정되지 않습니다.</div>",
  "11-20": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>② 법정대리인은 자기 책임하에 언제든지 복대리인을 선임할 수 있습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 복대리인은 '본인'의 대리인입니다.<br>③ 대리인의 파산은 대리권 소멸 사유이므로 복대리권도 소멸합니다.<br>④ 임의대리인은 원칙적으로 복임권이 없고 본인 승낙이나 부득이한 사유가 있어야 합니다.</div>",
  "11-21": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>④ 상대방이 乙에게 대리권 없음을 알았거나 알 수 있었을 때에는 乙에게 책임을 물을 수 없습니다(제135조).</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>③ 변경을 가한 추인은 상대방의 동의가 있어야 효력이 있습니다.<br>⑤ 무권대리인이 본인을 상속한 경우 거절하는 것은 신의칙 위반입니다.</div>",
  "11-22": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>② 시·분·초 단위로 정한 기간은 즉시 기산하므로, 6월 1일 16시 + 72시간(3일) = 6월 4일 16시가 맞습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 일 단위 기간은 초일 불산입이므로 6월 2일 0시부터 이틀 뒤인 6월 3일 24시(4일 0시)에 만료합니다.<br>④ 연령 계산은 초일을 산입하므로 5월 16일 0시에 성년자가 됩니다.</div>",
  "11-23": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>④ 소멸시효의 기간(몇 년인지)은 법규의 해석 문제이므로 법원이 직권으로 판단하여야 합니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 선택권 행사 가능 시점부터 진행합니다.<br>⑤ 동시이행 항변권이 있더라도 시효는 진행합니다.</div>",
  "11-24": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>① 의사의 치료 채권, 연예인의 임금 등은 **3년**이 아니라 **1년**의 단기소멸시효가 적용됩니다. (참고: 도급공사, 전문직 채권은 3년)</div>",
  "11-25": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>③ 가압류에 의한 시효중단의 효력은 가압류 집행이 유지되는 동안 계속됩니다. 본안 판결 확정만으로 당연히 소멸하는 것이 아닙니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>②, ⑤ 승인은 권리 처분 능력까지는 요하지 않습니다.<br>④ 재판 확정 시부터 새로 10년의 시효가 진행합니다.</div>",

  "12-1": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>사정변경의 원칙에서 말하는 '사정'은 객관적 사정을 의미하며, 당사자의 주관적·개인적 사정은 포함되지 않는다는 것이 판례의 입장입니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 신의칙 위반은 강행규정 위반이므로 법원이 직권으로 판단할 수 있습니다.<br>③ 실효의 원칙은 사법관계뿐만 아니라 공법관계에도 적용될 수 있습니다.<br>④ 기획여행업자는 여행자의 안전을 확보할 신의칙상 보호의무를 부담합니다.<br>⑤ 동시이행항변권을 오직 이행 회피 목적으로만 행사하는 것은 권리남용에 해당합니다.</div>",
  "12-2": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>제한능력자의 이익 현존은 추정되므로, 반대로 이익이 현존하지 않음을 주장하는 자(甲)가 이를 증명해야 합니다. 또한 의사무능력자의 무효 주장 자체가 신의칙 위반은 아닙니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>ㄱ. 의사무능력자가 무효를 주장하는 것은 신의칙에 반한다고 볼 수 없습니다.<br>ㄴ. 의사무능력자에게도 제141조 단서(현존이익 반환)가 유추 적용됩니다.<br>ㄷ. 이익이 현존하지 않는다는 사실에 대한 증명책임은 무효를 주장하며 반환 범위를 제한하려는 측에 있습니다.</div>",
  "12-3": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>법정대리인의 동의는 명시적뿐만 아니라 묵시적으로도 가능합니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 미성년자 보호를 위한 행위능력 규정은 강행규정입니다.<br>③ 허락을 얻은 특정한 영업에 관해서는 성년자와 동일한 행위능력이 인정됩니다.<br>④ 영업허가의 취소 또는 제한은 선의의 제3자에게 대항하지 못합니다.<br>⑤ 상대방의 철회권은 계약 당시에 미성년자임을 알지 못한 경우(선의)에만 인정됩니다.</div>",
  "12-4": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>특정후견은 성년후견이나 한정후견과 달리 본인의 의사에 반하여 할 수 없습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 대리인은 행위능력자임을 요하지 않으므로 피성년후견인도 대리인이 될 수 있습니다.<br>③ 특정후견 심판 청구권자에는 검사 및 지방자치단체의 장이 포함됩니다.<br>④ 특정후견은 기간이나 사무 범위가 종료되면 당연히 종료됩니다.<br>⑤ 심판 시에는 반드시 후견의 기간 또는 사무의 범위를 정해야 합니다.</div>",
  "12-5": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>감사는 법인의 재산상황이나 업무집행에 관하여 부정·불비한 점을 발견하면 보고를 위해 '임시총회'를 소집할 권한이 있습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 법인은 법률의 규정에 의함이 아니면 성립하지 못합니다.<br>② 설립자가 이사 임면 방법을 정하지 않고 사망한 경우 법원이 정할 수 있습니다.<br>③ 목적 달성이 불능인 경우 주무관청 허가를 얻어 정관 변경이 가능합니다.<br>⑤ 청산종결등기가 되었더라도 청산사무가 실제 완료되지 않았다면 법인은 존속합니다.</div>",
  "12-6": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>이사의 사임은 단독행위로서 법인에 대한 의사표시로 효력이 발생하며 주무관청의 승인을 요하지 않습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 정관에 다른 정함이 없으면 이사의 과반수로 사무를 결정합니다.<br>② 이사가 없거나 결원이 있어 손해가 염려될 때 임시이사를 선임할 수 있습니다.<br>③ 이사는 특정한 행위를 대리하게 할 수 있지만 포괄적 대리권 수여는 불가능합니다.<br>④ 정관에 해임 사유가 규정된 경우 그 사유 없이 이사를 해임할 수 없습니다.</div>",
  "12-7": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>이사와 법인의 이익이 상반하는 사항에 관하여는 이사의 대표권이 없으며 특별대리인을 선임해야 합니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>ㄱ. 민법 제64조 규정에 따라 특별대리인을 선임해야 한다는 지문은 옳습니다.<br>ㄴ. 대표권 범위 내의 행위 효과는 법인에 귀속되므로 甲 개인이 원상회복의무를 지지 않습니다.<br>ㄷ. 이사의 대표권 제한은 등기하지 않으면 선의·악의 불문 제3자에게 대항할 수 없습니다.</div>",
  "12-8": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>민법 제100조 제2항(종물은 주물의 처분에 따른다)은 임의규정이므로 당사자 간의 특약으로 종물을 제외하고 주물만을 처분할 수 있습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 종물은 독립된 물건이어야 하므로 주물의 구성부분은 종물이 아닙니다.<br>② 부동산도 종물이 될 수 있습니다.<br>③ 행정재산이 공용폐지되어 시효취득 대상이 된다는 증명책임은 주장하는 자에게 있습니다.<br>④ 건물 사용 대가로 받는 것은 법정과실입니다.</div>",
  "12-9": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>비자금을 소극적으로 은닉하기 위해 임치한 행위는 그 자체로 반사회적 법률행위라고 볼 수 없습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 공무원의 직무행위에 관하여 금품을 수수하는 약정은 반사회적입니다.<br>② 보험금 부정취득 목적의 보험계약은 무효입니다.<br>③ 성매매 선불금 대여 약정은 반사회적 법률행위로 무효입니다.<br>④ 비자금 임치 자체가 사회질서에 반하는 것은 아닙니다.<br>⑤ 도박자금 대여 및 도박 채무 변제 약정은 무효입니다.</div>",
  "12-10": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>경매는 국가의 강제권 행사에 의한 것이므로 민법 제104조(불공정한 법률행위) 규정이 적용되지 않습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>② 불공정성 판단 기준 시점은 법률행위 당시입니다.<br>③ 궁박, 경솔, 무경험은 하나만 갖추어도 충분합니다.<br>④ 궁박은 정신적·심리적 원인에 기인한 경우도 포함됩니다.<br>⑤ 무경험은 일반적인 거래 경험의 부족을 의미합니다.</div>",
  "12-11": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>제시된 사례(ㄱ, ㄴ, ㄷ)는 모두 판례상 비진의표시로서 무효가 되지 않고 표시된 대로 효력이 발생하는 사례들입니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>ㄱ. 사직의 의사표시와 같은 공법상 행위에는 비진의표시 규정이 적용되지 않습니다.<br>ㄴ. 명의대여자는 스스로 채무를 부담할 의사가 있는 것으로 보아 비진의표시에 해당하지 않습니다.<br>ㄷ. 강박에 의해서나마 증여를 하기로 결정했다면 효과의사가 결여된 것은 아닙니다.</div>",
  "12-12": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>파산관재인은 제3자에 해당하며 선의 여부는 파산채권자 전체를 기준으로 판단하므로 채권자 중 일부라도 선의라면 乙은 戊에게 대항할 수 없습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>ㄱ. 포괄승계인이나 계약상 지위를 이전받은 자는 '제3자'가 아닙니다.<br>ㄴ. 제108조 제2항의 제3자는 선의이기만 하면 족하며 무과실은 요건이 아닙니다.</div>",
  "12-13": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>매도인이 계약을 적법하게 해제한 후라도 매수인은 착오를 이유로 취소권을 행사하여 전체를 무효로 만들 수 있습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 착오 취소는 적법한 권리행사이므로 불법행위로 인한 손해배상책임을 지지 않습니다.<br>② 민법 제109조는 임의규정이므로 당사자 합의로 취소권을 배제할 수 있습니다.<br>④ 담보책임이 성립하더라도 별도로 착오 취소가 가능합니다.<br>⑤ 상대방이 착오를 알고 이용했다면 표의자에게 중과실이 있어도 취소할 수 있습니다.</div>",
  "12-14": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>상품 광고에서 거래의 관행상 허용되는 정도의 과장은 기망행위에 해당하지 않습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 상대방이 이미 알고 있는 사실은 고지의무의 대상이 아닙니다.<br>② 제3자의 사기 시 손해배상을 위해 반드시 계약을 취소할 필요는 없습니다.<br>③ 취소권의 행사기간은 제척기간입니다.<br>④ 소송행위에는 원칙적으로 비진의표시, 사기·강박 규정이 적용되지 않습니다.</div>",
  "12-15": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>대리인 甲을 기준으로 착오 여부를 판단하므로 甲에게 착오가 없다면 본인 乙은 취소할 수 없습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>② 대리인의 사기는 본인과 동일시되므로 본인의 인지 여부와 상관없이 취소 가능합니다.<br>③ 이중매매 적극가담 여부도 대리인 甲을 기준으로 판단합니다.<br>④ 궁박은 본인 기준, 경솔·무경험은 대리인 기준입니다.<br>⑤ 계약 해제권은 본인에게 귀속되므로 대리인은 특별권한이 있어야 합니다.</div>",
  "12-16": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>복대리인 선임권이 없는 대리인이 선임한 복대리인의 권한도 권한을 넘은 표현대리의 기본대리권이 될 수 있습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 제126조 표현대리는 법정대리에도 적용됩니다.<br>② '정당한 이유'는 대리행위 당시를 기준으로 판단합니다.<br>④ 대리권 소멸 후 그 범위를 넘는 행위를 한 경우에도 제126조가 적용될 수 있습니다.<br>⑤ 표현대리는 대리의사(현명)가 있는 경우에만 성립합니다.</div>",
  "12-17": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>토지거래허가 구역 내에서 허가를 배제하거나 면탈할 목적으로 체결된 계약은 처음부터 확정적 무효입니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 무효인 법률행위는 처음부터 아무런 효력이 발생하지 않습니다.<br>② 무효행위의 추인은 명시적·묵시적 모두 가능합니다.<br>④ 반사회적 무효는 절대적 무효이므로 선의의 제3자에게도 대항할 수 있습니다.<br>⑤ 무효인 법률행위의 상대방도 일반적인 취소 상대방 법리가 적용됩니다.</div>",
  "12-18": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>법정대리인은 취소의 원인이 소멸하기 전(미성년 상태 등)이라도 언제든지 추인할 수 있습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 제한능력자는 선·악 불문 현존이익만 상환할 책임이 있습니다.<br>② 취소권은 단독으로 행사하는 형성권입니다.<br>③ 취소권의 제척기간 경과 여부는 법원의 직권 조사 사항입니다.<br>⑤ 취소권은 추인할 수 있는 날로부터 3년, 법률행위를 한 날로부터 10년 내에 행사해야 합니다.</div>",

function installPWA() {

            }
            deferredPrompt = null;
            closeBanner();
        });
    }
}

function updateQuickNumbers() {

    const currentUnit = quickRound >= 5 ? 25 : 20;
    
    // 2. 단위에 따른 범위 계산 (자동 계산)
    const range = quickSubject === 'civil' ? [1, currentUnit] : 
                  quickSubject === 'admin' ? [currentUnit + 1, currentUnit * 2] : 
                  [currentUnit * 2 + 1, currentUnit * 3];
    
    let html = '';
    // 3. 계산된 범위만큼 버튼 생성
    for (let i = range[0]; i <= range[1]; i++) {

    }
    container.innerHTML = html;
}

// 특정 문제로 바로 이동
function jumpToQuestion(round, num) {
    // 해당 회차의 같은 과목 문제 전체 가져오기
    let subjectQuestions;
    
    // 전역 함수를 사용하여 기준(20 or 25)을 가져옵니다.
    const unit = getUnitSize(round);

    if (num >= 1 && num <= unit) {
        // 민법 (1-20번 또는 1-25번)
        subjectQuestions = allQuestions.filter(q => (q.round || 1) === round && q.num >= 1 && q.num <= unit);
    } else if (num >= (unit + 1) && num <= (unit * 2)) {
        // 행정법 (21-40번 또는 26-50번)
        subjectQuestions = allQuestions.filter(q => (q.round || 1) === round && q.num >= (unit + 1) && q.num <= (unit * 2));
    } else {
        // 행정학 (41-60번 또는 51-75번)
        subjectQuestions = allQuestions.filter(q => (q.round || 1) === round && q.num >= (unit * 2 + 1) && q.num <= (unit * 3));
    }

    // 번호순 정렬
    subjectQuestions.sort((a, b) => a.num - b.num);

    if (subjectQuestions.length === 0) {
        alert('해당 문제를 찾을 수 없습니다.');
        return;
    }

    // 선택한 문제의 인덱스 찾기
    const startIndex = subjectQuestions.findIndex(q => q.num === num);

    // 전체 문제 세트로 설정, 선택한 문제부터 시작
    currentQuestions = subjectQuestions;
    currentIndex = startIndex >= 0 ? startIndex : 0;
    correctCount = 0;
    wrongCount = 0;

    // 퀴즈 화면 랜덤 버튼 동기화
    const quizBtn = document.getElementById('randomToggleQuiz');
    if (isRandomMode) {
        quizBtn.classList.add('active');
    } else {
        quizBtn.classList.remove('active');
    }

    // 화면 전환
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('quizScreen').style.display = 'block';

    updateStats();
    showQuestion();
}

function toggleRandomInQuiz() {
    isRandomMode = !isRandomMode;
    const btn = document.getElementById('randomToggleQuiz');
    if (isRandomMode) {
        btn.classList.add('active');
    } else {
        btn.classList.remove('active');
    }
    
    // 현재 진행상황 저장
    const currentQuestionNum = currentQuestions[currentIndex].num;
    const currentRound = currentQuestions[currentIndex].round || 1;
    
    // 남은 문제들 재정렬
    const answeredQuestions = currentQuestions.slice(0, currentIndex);
    let remainingQuestions = currentQuestions.slice(currentIndex);
    
    if (isRandomMode) {
        // 랜덤으로 섞기
        remainingQuestions = shuffleArray(remainingQuestions);
    } else {
        // 순서대로 정렬
        remainingQuestions.sort((a, b) => {
            if ((a.round || 1) !== (b.round || 1)) {
                return (a.round || 1) - (b.round || 1);
            }
            return a.num - b.num;
        });
    }
    
    // 합치기
    currentQuestions = answeredQuestions.concat(remainingQuestions);
}

function shuffleArray(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function startQuiz() {
    const round = selectedRound;
    const subject = selectedSubject;
    let filteredQuestions = allQuestions;
    
    // 회차 필터 (동적 처리)
    if (round && round !== 'all') {
    const roundNum = parseInt(round);
    
    filteredQuestions = filteredQuestions.filter(q => {
        // 1회일 경우: round 속성이 없거나(undefined) 1인 경우 모두 포함
        if (roundNum === 1) {
            return !q.round || q.round === 1;
        }
        // 2회 이상일 경우: 해당 숫자와 정확히 일치하는 것만 필터링
        return q.round === roundNum;
    });
}
    // 과목 필터
    
    const unit = getUnitSize(round); // 함수를 직접 호출하여 사용

    if (subject === 'civil') {
        filteredQuestions = filteredQuestions.filter(q => q.num >= 1 && q.num <= unit);
    } else if (subject === 'admin') {
        filteredQuestions = filteredQuestions.filter(q => q.num >= (unit + 1) && q.num <= (unit * 2));
    } else if (subject === 'adminTheory') {
        filteredQuestions = filteredQuestions.filter(q => q.num >= (unit * 2 + 1) && q.num <= (unit * 3));
    }
    
    // 랜덤 모드 활성화 시에만 섞기, 아니면 순서대로
    if (isRandomMode) {
        currentQuestions = shuffleArray(filteredQuestions);
    } else {
        // 순서대로 정렬 (회차 -> 문제번호)
        currentQuestions = filteredQuestions.sort((a, b) => {
            if ((a.round || 1) !== (b.round || 1)) {
                return (a.round || 1) - (b.round || 1);
            }
            return a.num - b.num;
        });
    }
    
    currentIndex = 0;
    correctCount = 0;
    wrongCount = 0;
    
    // 퀴즈 화면 랜덤 버튼 동기화
    const quizBtn = document.getElementById('randomToggleQuiz');
    if (isRandomMode) {
        quizBtn.classList.add('active');
    } else {
        quizBtn.classList.remove('active');
    }
    
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('quizScreen').style.display = 'block';
    
    // 타이머 시작
    startTime = Date.now();
    pausedTime = 0;
    isPaused = false;
    startTimer();
    
    updateStats();
    showQuestion();
}

function showQuestion() {
    if (currentIndex >= currentQuestions.length) {
        showComplete();
        return;
    }
    
    const q = currentQuestions[currentIndex];
    const unit = getUnitSize(q.round); //위에서 만든 함수 호출
    
    answered = false;

    // unit 변수를 사용하여 과목 판별
    const subjects = ['민법(총칙)', '행정법', '행정학개론'];
    // q.num이 1~25면 index 0, 26~50이면 index 1, 51~75면 index 2가 나오게 계산
    let subjectName = subjects[Math.floor((q.num - 1) / unit)];
    let roundText = `제${q.round || 1}회`;

    document.getElementById('questionSource').textContent = `${roundText} ${subjectName} ${q.num}번`;
    document.getElementById('questionNumber').textContent = `${currentIndex + 1} / ${currentQuestions.length}`;
    
    // ㄱ, ㄴ, ㄷ, ㄹ 항목을 하나의 회색 박스로 묶기
    let formattedQuestion = q.question
        .replace(/\*\*(.*?)\*\*/g, '<strong style="color: #4f46e5;">$1</strong>');

    // <br>로 구분된 ㄱ~ㅁ 항목들을 하나의 박스로 묶기
    formattedQuestion = formattedQuestion.replace(
        /((?:(?:ㄱ|ㄴ|ㄷ|ㄹ|ㅁ)\..+?(?:<br>|$))+)/g,
        (match) => {
            const items = match.split('<br>').filter(s => s.trim());
            const itemDivs = items.map(item => `<div class="option-item">${item.trim()}</div>`).join('');
            return `<div class="option-box">${itemDivs}</div>`;
        }
    );
    
    document.getElementById('questionText').innerHTML = formattedQuestion;
    
    const choicesContainer = document.getElementById('choicesContainer');
    choicesContainer.innerHTML = '';
    
    const numbers = ['①', '②', '③', '④', '⑤'];
    
    q.choices.forEach((choice, index) => {
        if (!choice) return;
        const choiceDiv = document.createElement('div');
        choiceDiv.className = 'choice-item';
        choiceDiv.innerHTML = `
            <span class="choice-number">${numbers[index]}</span>
            <span class="choice-text">${choice.replace(/\*\*(.*?)\*\*/g, '<strong style="color: #4f46e5;">$1</strong>')}</span>
        `;
        choiceDiv.onclick = () => selectChoice(index + 1);
        choicesContainer.appendChild(choiceDiv);
    });
    
    document.getElementById('resultPanel').className = 'result-panel';
    updateNavigationButtons();
    
    updateProgress();
}

function selectChoice(choiceNum) {
    if (answered) return;
    answered = true;
    
    const q = currentQuestions[currentIndex];
    
    // 1. 정답 판별 로직 수정 (배열이면 포함여부 확인, 숫자면 단순 비교)
    const isCorrect = Array.isArray(q.answer) 
        ? q.answer.includes(choiceNum) 
        : (choiceNum === q.answer);
    
    if (isCorrect) {
        correctCount++;
    } else {
        wrongCount++;
    }
    
    const choiceItems = document.querySelectorAll('.choice-item');
    choiceItems.forEach((item, idx) => {
        const itemNum = idx + 1;
        item.classList.add('disabled');
        
        // 2. 화면에 정답 표시 (배열/숫자 모두 대응)
        const isThisCorrectNum = Array.isArray(q.answer) 
            ? q.answer.includes(itemNum) 
            : (itemNum === q.answer);

        if (isThisCorrectNum) {
            item.classList.add('correct'); // 정답인 번호들은 초록색으로
        } else if (itemNum === choiceNum) {
            item.classList.add('wrong');   // 내가 고른 게 틀렸으면 빨간색으로
        }
    });

    // 이후에 resultPanel 보여주는 코드가 이어지면 됩니다!
    
    const resultPanel = document.getElementById('resultPanel');
    if (isCorrect) {
        resultPanel.className = 'result-panel correct';
        document.getElementById('resultTitle').textContent = '✓ 정답입니다!';
    } else {
        resultPanel.className = 'result-panel wrong';
        document.getElementById('resultTitle').textContent = '✗ 오답입니다';
    }
    const answerDisplay = Array.isArray(q.answer) ? q.answer.join(', ') : q.answer;
    document.getElementById('resultAnswer').textContent = `정답: ${answerDisplay}번`;
    
    // 해설 표시
    const explanationKey = `${q.round || 1}-${q.num}`;
    const explanationSection = document.getElementById('explanationSection');
    const explanationContent = document.getElementById('explanationContent');
    
    if (explanations[explanationKey]) {
        explanationSection.style.display = 'block';
        explanationContent.innerHTML = explanations[explanationKey];
        explanationContent.style.display = 'none'; // 초기에는 숨김
        document.getElementById('btnExplanation').textContent = '💡 해설 보기';
    } else {
        explanationSection.style.display = 'none';
    }
    
    updateNavigationButtons();
    updateStats();
}

function nextQuestion() {
    currentIndex++;
    showQuestion();
}

function prevQuestion() {
    if (currentIndex > 0) {
        currentIndex--;
        showQuestion();
    }
}

function updateNavigationButtons() {
    const btnGroup = document.querySelector('.button-group');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    
    if (answered) {
        // 답변했으면 버튼 그룹 보이기
        btnGroup.classList.add('show');
        // 첫 문제면 뒤로 버튼 비활성화
        btnPrev.disabled = (currentIndex === 0);
        // 다음 버튼은 항상 활성화
        btnNext.disabled = false;
    } else {
        // 답변 안 했으면 버튼 그룹 숨기기
        btnGroup.classList.remove('show');
    }
}

function toggleExplanation() {
    const explanationContent = document.getElementById('explanationContent');
    const btnExplanation = document.getElementById('btnExplanation');
    
    if (explanationContent.style.display === 'none') {
        explanationContent.style.display = 'block';
        btnExplanation.textContent = '🔼 해설 닫기';
    } else {
        explanationContent.style.display = 'none';
        btnExplanation.textContent = '💡 해설 보기';
    }
}

function updateStats() {
    document.getElementById('correctCount').textContent = correctCount;
    document.getElementById('wrongCount').textContent = wrongCount;
    document.getElementById('totalCount').textContent = currentQuestions.length;
}

function updateProgress() {
    const progress = currentQuestions.length > 0 ? Math.round(((currentIndex) / currentQuestions.length) * 100) : 0;
    document.getElementById('progressBar').style.width = progress + '%';
    document.getElementById('progressText').textContent = progress + '%';
}

function showComplete() {
    stopTimer(); // 타이머 정지
    
    document.getElementById('quizScreen').style.display = 'none';
    document.getElementById('completeScreen').style.display = 'block';
    const total = correctCount + wrongCount;
    const rate = total > 0 ? Math.round((correctCount / total) * 100) : 0;
    document.getElementById('finalCorrect').textContent = correctCount;
    document.getElementById('finalWrong').textContent = wrongCount;
    document.getElementById('finalRate').textContent = rate + '%';
    document.getElementById('finalTime').textContent = getElapsedTime();
}

// 타이머 시작
function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    
    timerInterval = setInterval(() => {
        if (!isPaused) {
            const elapsed = Date.now() - startTime - pausedTime;
            updateTimerDisplay(elapsed);
        }
    }, 1000);
}

// 타이머 표시 업데이트
function updateTimerDisplay(elapsed) {
    const minutes = Math.floor(elapsed / 60000);
    const seconds = Math.floor((elapsed % 60000) / 1000);
    document.getElementById('timer').textContent = 
        `⏱️ ${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
}

// 타이머 정지/재시작 토글
function toggleTimer() {
    const timerEl = document.getElementById('timer');
    
    if (isPaused) {
        // 재시작
        isPaused = false;
        pausedTime += Date.now() - pauseStartTime;
        timerEl.classList.remove('paused');
    } else {
        // 정지
        isPaused = true;
        pauseStartTime = Date.now();
        timerEl.classList.add('paused');
    }
}

// 타이머 정지
function stopTimer() {
    if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
    }
}

// 경과 시간 가져오기 (완료 화면용)
function getElapsedTime() {
    const elapsed = Date.now() - startTime - pausedTime;
    const minutes = Math.floor(elapsed / 60000);
    const seconds = Math.floor((elapsed % 60000) / 1000);
    return `${minutes}분 ${seconds}초`;
}

function goHome() {
    stopTimer();
    currentIndex = 0;
    correctCount = 0;
    wrongCount = 0;
    answered = false;
    startTime = null;
    pausedTime = 0;
    isPaused = false;
    document.getElementById('timer').textContent = '⏱️ 00:00';
    document.getElementById('timer').classList.remove('paused');
    document.getElementById('startScreen').style.display = 'block';
    document.getElementById('quizScreen').style.display = 'none';
    document.getElementById('completeScreen').style.display = 'none';
}

// 페이지 로드 시 초기화
window.onload = function() {
    updateQuickNumbers();
    
    // PWA Service Worker 등록
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('Service Worker 등록 성공'))
            .catch(err => console.log('Service Worker 등록 실패:', err));
    }
};
    </script>
