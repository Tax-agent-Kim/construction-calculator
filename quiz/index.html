  {num:14, round:12, question: "사기ㆍ강박에 의한 의사표시에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)", choices:["신의칙상 고지의무를 부담하는 자는 고지의무의 대상이 되는 사실을 이미 알고 있는 자에 대해서도 그 사실을 고지하여야 한다.", "계약이 제3자의 위법한 사기행위로 체결된 경우, 표의자가 제3자를 상대로 사기로 인한 손해배상을 청구하기 위해서는 그 계약을 취소해야 한다.", "강박에 의한 의사표시에 대한 취소권의 행사기간은 소멸시효기간이다.", "소송행위가 강박에 의하여 이루어진 경우, 특별한 사정이 없는 한 강박을 이유로 소송행위를 취소할 수 있다.", "상품의 선전ㆍ광고에 다소의 과장이나 허위가 수반되는 것은 그것이 일반 상거래의 관행과 신의칙에 비추어 시인될 수 있는 한 기망성이 결여된다."], answer:[5]},
  {num:15, round:12, question: "甲은 친구 乙로부터 丙 소유의 X토지를 매수할 대리권을 수여받아, 乙을 대리하여 丙과 X에 관한 매매계약을 체결하였다. 이에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)", choices:["매매계약 내용의 중요부분에 관하여 乙의 착오가 있는 경우, 甲에게는 착오가 없더라도 乙은 자신의 착오를 이유로 매매계약을 취소할 수 있다.", "甲의 사기로 丙이 매도의 의사표시를 한 경우, 乙이 그 사실을 몰랐더라도 丙은 사기를 이유로 그 의사표시를 취소할 수 있다.", "丙이 이중매매를 하였고 위 매매계약이 제2매매인 경우에 甲이 丙의 배임행위에 적극 가담하였다면, 乙이 그 사정을 몰랐더라도 매매계약은 무효이다.", "매매계약이 乙에게 불공정한 법률행위에 해당하는지 판단할 때 경솔, 무경험은 乙이 아닌 甲을 기준으로 판단한다.", "丙의 채무불이행이 있는 경우, 甲은 특별한 사정이 없는 한 채무불이행을 이유로 한 계약해제권을 가지지 않는다."], answer:[1]},
  {num:16, round:12, question: "권한을 넘은 표현대리에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)", choices:["권한을 넘은 표현대리에 관한 규정은 법정대리에도 적용된다.", "대리인이 그 권한 외의 법률행위를 한 경우, 대리인에게 그 권한이 있다고 상대방이 믿을 만한 정당한 이유가 있는지 여부는 대리행위 당시를 기준으로 결정해야 한다.", "복대리인 선임권이 없는 대리인에 의하여 선임된 복대리인의 권한은 기본대리권이 될 수 없다.", "대리권소멸 후의 표현대리가 인정되는 경우, 그 표현대리의 권한을 넘은 대리행위가 있을 때에는 권한을 넘은 표현대리가 성립할 수 있다.", "대리행위의 표시를 하지 아니하고 자기가 본인인 것처럼 기망하여 본인 명의로 직접 법률행위를 한 경우, 특별한 사정이 없는 한 권한을 넘은 표현대리는 성립할 수 없다."], answer:[3]},
  {num:17, round:12, question: "법률행위의 무효와 취소에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)", choices:["취소된 법률행위는 처음부터 무효인 것으로 본다.", "무효행위의 추인은 묵시적으로 할 수 있다.", "토지거래계약 허가구역 내 토지에 대하여 처음부터 허가를 잠탈하는 내용의 매매계약이 체결된 경우, 그 계약은 유동적 무효이다.", "반사회질서의 법률행위로서 무효인 경우, 그 무효로 선의의 제3자에게 대항할 수 있다.", "취소할 수 있는 법률행위의 상대방이 확정된 경우에는 그 취소는 그 상대방에 대한 의사표시로 하여야 한다."], answer:[3]},
  {num:18, round:12, question: "미성년자 甲은 자신의 자전거를 乙에게 매도하는 계약을 체결하였고 甲은 미성년자 임을 이유로 계약을 취소하려고 한다. 이에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)", choices:["甲은 계약을 취소하면 그가 악의인 경우에도 그 현존이익의 한도에서 상환할 책임이 있다.", "甲은 법정대리인의 동의 없이 단독으로 계약을 취소할 수 있다.", "甲의 취소권의 행사기간은 법원의 직권조사사항이다.", "甲의 법정대리인이 취소할 수 있는 법률행위를 추인하는 경우, 그 추인은 취소의 원인이 소멸된 후에 하여야만 효력이 있다.", "甲의 취소권은 추인할 수 있는 날로부터 3년내에, 법률행위를 한 날로부터 10년내에 행사하여야 한다."], answer:[4]},
  {num:19, round:12, question: "법률행위의 조건과 기한에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)", choices:["기한의 이익은 특약이나 법률행위의 성질로 분명하지 아니한 경우에는 채무자를 위한 것으로 추정한다.", "채무자가 담보를 손상하게 한 때에 그는 기한의 이익을 주장하지 못한다.", "조건있는 법률행위의 당사자는 조건의 성부가 미정한 동안에는 조건의 성취로 인하여 생길 상대방의 이익을 해하지 못한다.", "2024년 4월에 ‘2024년 제12회 행정사 시험에 응시하여 최종 합격하면 자동차를 사준다’는 법률행위를 한 경우, 이는 특별한 사정이 없는 한 정지조건부 법률행위이다.", "불법조건이 붙은 법률행위는 그 조건만 무효이다."], answer:[5]},
  {num:20, round:12, question: "법률행위의 부관에 관한 설명으로 옳은 것은?", choices:["정지조건 있는 법률행위는 조건이 성취한 때로부터 그 효력을 잃는다.", "조건이 법률행위의 당시에 이미 성취할 수 없는 불능조건인 경우에는 그 조건이 해제 조건이면 그 법률행위는 무효로 한다.", "종기(終期)있는 법률행위는 기한이 도래한 때로부터 그 효력이 생긴다.", "기한의 이익이 상대방에게도 있는 경우에 당사자 일방은 그 상대방의 손해를 배상하고 기한의 이익을 포기할 수 있다.", "조건의 성취가 미정한 권리의무는 일반규정에 의하여 처분, 상속 또는 담보로 할 수 없다."], answer:[4]},
  {num:21, round:12, question: "민법상 기간에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)", choices:["내년 6월 1일부터 ‘4일 동안’이라고 하는 경우에 그 기산점은 내년 6월 1일이다.", "기간을 시(時)로 정한 때에는 즉시로부터 기산한다.", "정년이 60세라고 하는 것은 특별한 사정이 없으면 만60세가 만료되는 날을 말한다.", "1세에 이른 사람의 나이는 출생일을 산입하여 만(滿) 나이로 계산하고 연수(年數)로 표시한다.", "어느 기간의 말일인 6월 4일이 토요일이고 6월 6일이 공휴일인 경우, 그 기간은 6월 7일에 만료한다."], answer:[1]},
  {num:22, round:12, question: "甲의 乙에 대한 채권의 소멸시효기간이 가장 긴 것은? (甲, 乙은 상인이 아님)", choices:["甲이 연예인 乙에게 물건을 공급한 경우, 甲의 물건공급대금채권", "甲의 동산을 乙이 사용한 경우, 甲의 동산사용료채권", "甲교사의 강의를 乙학생이 수강한 경우, 甲의 수강료채권", "甲이 乙에게 부동산을 매도한 경우, 甲의 매매대금채권", "생산자 甲이 乙에게 생산물을 판매한 경우, 甲의 생산물대금채권"], answer:[4]},
  {num:23, round:12, question: "소멸시효의 효력에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)", choices:["소멸시효는 그 기산일에 소급하여 효력이 생긴다.", "주된 권리의 소멸시효가 완성한 때에는 종속된 권리에 그 효력이 미친다.", "소멸시효는 법률행위에 의하여 이를 배제할 수 없으나 연장할 수는 있다.", "소멸시효의 이익은 미리 포기하지 못한다.", "채무자가 소멸시효 완성 후 채권자에 대하여 채무 일부를 변제함으로써 시효의 이익을 포기한 경우, 포기한 때로부터 새로이 소멸시효가 진행한다."], answer:[3]},
  {num:24, round:12, question: "소멸시효에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)", choices:["부동산 매수인이 목적 부동산을 인도받아 계속 점유하고 있는 경우, 매수인의 소유권 이전등기청구권은 채권이므로 소멸시효가 진행한다.", "소유권에 기한 물권적 청구권은 소멸시효에 걸리지 아니한다.", "판결에 의하여 확정되고 판결 확정 당시에 변제기가 도래한 채권은 단기소멸시효에 해당한 것이라도 그 판결의 당사자 사이에서 그 시효기간은 10년으로 한다.", "시효의 중단은 원칙적으로 당사자 및 그 승계인 사이에만 효력이 있다.", "점유권은 시효에 걸리지 아니한다."], answer:[1]},
  {num:25, round:12, question: "소멸시효의 중단과 정지에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)", choices:["채무자가 제기한 소에 대하여 채권자가 응소하여 그 소송에서 적극적으로 권리를 주장하고 그것이 받아들여진 경우, 재판상의 청구가 될 수 있다.", "승소 확정판결을 받은 채권자가 그 판결상 채권의 시효중단을 위해 후소를 제기하는 경우, 재판상 청구가 있다는 점에 대하여만 확인을 구하는 형태의 새로운 방식의 확인소송은 허용될 수 없다.", "상속재산에 속한 권리나 상속재산에 대한 권리는 상속인의 확정, 관리인의 선임 또는 파산선고가 있는 때로부터 6월내에는 소멸시효가 완성하지 아니한다.", "화해를 위한 소환은 상대방이 출석하지 아니한 때에는 화해신청인이 1월내에 소를 제기하지 아니하면 시효중단의 효력이 없다.", "천재 기타 사변으로 소멸시효를 중단할 수 없을 때에는 그 사유가 종료한 때로부터 1월 내에는 시효가 완성하지 아니한다."], answer:[2]},

  {num:26, round:12, question: "통치행위에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)<br>ㄱ. 고도의 정치적 성격을 띤 국가행위로 사법심사 대상에서 제외된다.<br>ㄴ. 대통령의 서훈취소는 통치행위가 아니다.<br>ㄷ. 통치행위에 해당하는지의 최종적 판단은 오로지 사법부에 의하여 이루어져야 한다.<br>ㄹ. 남북정상회담 개최 과정에서 주무부 장관에게 신고하지 아니하거나 승인 없이 북한 측에 사업권의 대가 명목으로 송금한 행위는 통치행위가 아니다.", choices:["ㄱ, ㄷ", "ㄱ, ㄹ", "ㄱ, ㄴ, ㄹ", "ㄴ, ㄷ, ㄹ", "ㄱ, ㄴ, ㄷ, ㄹ"], answer:[1, 2, 3, 4, 5]},
  {num:27, round:12, question: "공법관계에 관한 소송이 아닌 것은? (다툼이 있으면 판례에 따름)", choices:["행정재산의 사용허가 신청에 대한 거부를 다투는 소송", "서울시립무용단 단원의 해촉에 관한 소송", "공익사업으로 인하여 이주하게 된 주거용 건축물의 세입자에게 인정되는 주거이전비 보상을 둘러싼 소송", "주민등록전입신고와 그 수리 여부에 관한 소송", "한국마사회 기수의 면허취소를 다투는 소송"], answer:[5]},
  {num:28, round:12, question: "공법상 계약에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)", choices:["공법상 계약에는 법률우위의 원칙이 적용된다.", "공법상 계약의 체결 시 계약의 목적 및 내용을 명확하게 적은 계약서를 작성하여야 한다.", "공법상 계약에 따른 권리ㆍ의무의 확인 소송은 공법상 당사자소송에 의한다.", "확약은 일방적 행위라는 점에서 복수당사자의 의사의 합치인 공법상 계약과는 구분된다.", "「국가를 당사자로 하는 계약에 관한 법률」에 따라 국가가 당사자가 되는 공공계약은 공법상 계약에 해당한다."], answer:[5]},
  {num:29, round:12, question: "행정규칙에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)", choices:["행정규칙은 특별한 사정이 없는 한 대외적으로 국민이나 법원을 구속하는 효력이 없다.", "처분이 행정규칙을 따른 것이면 적법성이 보장된다.", "처분이 행정규칙을 위반하였다고 해서 그러한 사정만으로 곧바로 위법하게 되는 것은 아니다.", "행정규칙에 따른 처분의 적법성 여부는 상위법령의 규정과 입법 목적 등에 적합한지 여부에 따라 판단해야 한다.", "행정규칙이 그 정한 바에 따라 되풀이 시행되어 행정관행이 이루어지게 되면 행정기관은 그 상대방에 대한 관계에서 그 규칙에 따라야 할 자기구속을 받게 된다."], answer:[2]},
  {num:30, round:12, question: "행정행위의 효력에 관한 판례의 내용으로 옳지 않은 것은?", choices:["행정행위는 불가쟁력의 효력이 있어 법령에 의한 불복기간이 경과한 경우에는 당사자는 그 행정처분의 효력을 다툴 수 없다.", "연령미달의 결격자가 타인의 이름으로 운전면허시험에 응시, 합격하여 교부받은 운전 면허는 당연무효는 아니다.", "민사소송에 있어서 어느 행정처분의 당연무효 여부가 선결문제로 되는 때에는 민사법원은 이를 판단하여 당연무효임을 전제로 판결할 수 있다.", "행정처분이 불복기간의 경과로 인하여 확정될 경우, 그 처분의 기초가 된 사실관계나 법률적 판단이 확정된다.", "구 「원자력법」에 따른 원자로 시설의 부지사전승인처분은 그 자체로서 독립한 행정처분 이다."], answer:[4]},
  {num:31, round:12, question: "행정기본법상 행정행위의 취소ㆍ철회에 관한 설명으로 옳은 것은?", choices:["위법한 처분의 일부에 대해 취소할 수 없다.", "부당한 처분에 대해서는 취소할 수 없다.", "당사자의 신뢰를 보호할 가치가 있는 경우에는 위법한 처분에 대해 장래를 향하여 취소할 수 있다.", "적법한 처분은 중대한 공익을 위하여 필요한 경우에도 그 처분의 전부를 철회할 수 없다.", "적법한 처분을 철회하는 경우에는 철회로 인하여 당사자가 입게 될 불이익을 철회로 달성되는 공익과 비교ㆍ형량할 필요는 없다."], answer:[3]},
  {num:32, round:12, question: "행정행위의 부관에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)", choices:["행정청은 처분에 재량이 없는 경우에는 법률에 근거가 있는 경우에 부관을 붙일 수 있다.", "부관은 해당 처분과 실질적인 관련이 있어야 하지만, 해당 처분의 목적에는 구속되지 않는다.", "법률이 예정하는 행정행위의 효과를 일부 배제하는 부관은 독립하여 행정소송의 대상이 될 수 있다.", "행정처분에 붙인 부담인 부관이 무효가 되면 그 부담의 이행으로 한 사법상 법률행위도 당연히 무효가 된다.", "「하천법」상 하천부지 점용허가에는 그 성질상 부관을 붙일 수 없다."], answer:[1]},
  {num:33, round:12, question: "甲은 건축물을 신축하기 위하여 허가청인 A에게 건축허가(주된 허가)를 신청하였다. 甲은 건축허가를 신청하면서 산지전용허가도 받고자 하는데, 건축법상 甲이 건축허가를 받으면 산지관리법에 따른 산지전용허가(관련 허가)를 받은 것으로 의제된다. 이에 관한 설명으로 옳지 않은 것은? (단, 관련 허가의 허가청은 B임)", choices:["甲은 건축허가를 A에게 신청하면서 산지전용허가에 필요한 서류를 함께 제출하여야 한다.", "A는 건축허가를 하기 전에 산지전용허가에 관하여 미리 B와 협의하여야 한다.", "B는 산지전용허가에 관한 법령을 위반하여 협의에 응해서는 아니 된다.", "A와 B 사이에 협의가 되면 건축허가와 산지전용허가를 모두 받은 것으로 본다.", "산지전용허가가 의제된 경우 B는 산지전용허가를 직접 한 것으로 보아 관계 법령에 따른 관리ㆍ감독 등 필요한 조치를 하여야 한다."], answer:[5]},
  {num:34, round:12, question: "행정절차법상 처분절차에 관한 설명으로 옳은 것은?", choices:["행정청은 처분을 할 때에는 단순ㆍ반복적인 처분으로서 당사자가 그 이유를 명백히 알 수 있는 경우에도 당사자에게 그 근거와 이유를 사전에 제시하여야 한다.", "행정청은 처분에 오기(誤記)가 있어서 직권으로 이를 정정한 경우에는 그 사실을 당사자에게 통지할 필요는 없다.", "행정청은 행정청의 편의를 위하여 신청인이 다른 행정청에 처분을 구하는 신청을 접수하게 할 수 있다.", "행정청은 다수의 행정청이 관여하는 처분을 구하는 신청을 접수한 경우에는 관계 행정청과의 신속한 협조를 통하여 그 처분이 지연되지 아니하도록 하여야 한다.", "행정청은 필요한 처분기준을 정하여 공표하는 것이 해당 처분의 성질상 현저히 곤란한 경우라도 그 처분기준을 공표하여야 한다."], answer:[4]},
  {num:35, round:12, question: "공공기관의 정보공개에 관한 법률의 내용으로 옳지 않은 것은?", choices:["공개될 경우 부동산 투기, 매점매석 등으로 특정인에게 이익 또는 불이익을 줄 우려가 있다고 인정되는 정보라도 공공기관이 보유ㆍ관리하는 정보라면 이를 공개하여야 한다.", "공공기관은 부득이한 사유가 없다면 정보공개의 청구를 받은 날부터 10일 이내에 공개 여부를 결정하여야 한다.", "공공기관은 공개 청구된 공개 대상 정보의 일부가 제3자와 관련이 있다고 인정할 때에는 그 사실을 제3자에게 지체 없이 통지하여야 한다.", "공공기관은 정보의 공개를 결정한 경우 해당 청구인이 사본의 교부를 원하는 때에는 이를 교부하여야 한다.", "정보공개청구는 말로써 할 수 있다."], answer:[1]},
  {num:36, round:12, question: "행정절차법상 청문에 관한 설명으로 옳지 않은 것은?", choices:["행정청은 다수 국민의 이해가 상충되는 처분을 하려는 경우에는 청문 주재자를 2명 이상으로 선정할 수 있다.", "청문은 당사자가 공개를 신청하더라도 제3자의 정당한 이익을 현저히 해칠 우려가 있는 경우에는 공개하여서는 아니 된다.", "청문 주재자는 직권으로 당사자등이 주장한 사실에 한하여 필요한 조사를 하여야 한다.", "청문 주재자는 필요하다고 인정할 때에는 관계 행정청에 필요한 문서의 제출을 요구할 수 있다.", "누구든지 청문을 통하여 알게 된 경영상의 비밀을 정당한 이유 없이 누설하여서는 아니 된다."], answer:[3]},
  {num:37, round:12, question: "질서위반행위규제법의 내용으로 옳지 않은 것은?", choices:["과태료 재판은 검사의 명령으로써 집행한다.", "신분에 의하여 성립하는 질서위반행위에 신분이 없는 자가 가담한 때에는 신분이 없는 자에 대하여는 질서위반행위가 성립하지 아니한다.", "질서위반행위 후 법률이 변경되어 그 행위가 질서위반행위에 해당하지 아니하게 된 때에는 법률에 특별한 규정이 없는 한 변경된 법률을 적용한다.", "「질서위반행위규제법」은 대한민국 영역 밖에서 질서위반행위를 한 대한민국의 국민에게 적용한다.", "하나의 행위가 2 이상의 질서위반행위에 해당하는 경우에는 각 질서위반행위에 대하여 정한 과태료 중 가장 중한 과태료를 부과한다."], answer:[2]},
  {num:38, round:12, question: "행정기본법상 의무자가 행정상 의무를 이행하지 아니하는 경우 행정청이 의무자의 신체나 재산에 실력을 행사하여 그 행정상 의무의 이행이 있었던 것과 같은 상태를 실현하는 것은?", choices:["행정대집행", "이행강제금의 부과", "직접강제", "강제징수", "즉시강제"], answer:[3]},
  {num:39, round:12, question: "국가배상책임에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)", choices:["「국가배상법」 제2조상의 직무행위에는 입법작용과 사법작용이 포함된다.", "국가가 국가배상책임을 이행한 경우 공무원에게 경과실이 있으면 국가는 그 공무원에게 구상할 수 있다.", "「국가배상법」은 「민법」 제756조 제1항 단서상의 사용자 면책조항에 상응하는 규정을 두고 있지 않다.", "부작위에 의한 국가배상책임의 성립요건 상 직무상 작위의무는 조리에 의해서도 성립할 수 있다.", "「국가배상법」 제5조상의 공공의 영조물에는 행정주체가 적법한 권한에 기하여 관리하고 있는 공물뿐만 아니라 사실상 관리하고 있는 공물도 포함된다."], answer:[2]},
  {num:40, round:12, question: "甲의 건축허가 신청에 대하여 관할 군수 乙은 거부처분을 하였으나, 해당 거부처분에 무효사유에 해당하는 하자가 있어 甲이 행정쟁송으로 다투고자 한다. 이에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)", choices:["甲은 거부처분 무효확인심판을 제기할 수 있다.", "甲은 의무이행심판을 제기할 수 있다.", "甲이 거부처분 무효확인소송을 제기한 경우 무효인 사유를 주장ㆍ증명할 책임은 甲에게 있다.", "甲이 거부처분 무효확인소송을 제기한 경우 「행정소송법」상 취소소송의 사정판결 규정은 준용되지 않는다.", "甲이 무효의 선언을 구하는 의미의 취소소송을 제기한 경우 제소기간의 제한이 없다."], answer:[5]},
  {num:41, round:12, question: "행정소송상 집행정지에 관한 설명으로 옳은 것을 모두 고른 것은?<br>ㄱ. 「행정소송법」상 집행정지는 부작위위법확인소송에는 인정되지 않는다.<br>ㄴ. 처분이 가분적이더라도 처분의 일부에 대한 집행정지는 허용되지 않는다.<br>ㄷ. 처분의 효력정지는 처분등의 집행을 정지함으로써 목적을 달성할 수 있는 경우에는 허용되지 않는다.<br>ㄹ. 집행정지의 결정에 대한 즉시항고에는 결정의 집행을 정지하는 효력이 인정 된다.", choices:["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄹ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ, ㄹ"], answer:[2]},
  {num:42, round:12, question: "행정심판법상 직접 처분과 간접강제에 관한 설명으로 옳은 것은?", choices:["거부처분 취소심판의 경우 행정심판위원회는 직접 처분을 할 수 있다.", "의무이행심판의 인용재결이 처분명령재결인 경우 행정심판위원회는 직접 처분을 할 수 없다.", "행정심판위원회는 사정의 변경이 있어 당사자가 신청하는 경우에도 간접강제 결정의 내용을 변경할 수 없다.", "행정심판의 청구인은 간접강제 결정에 불복하는 경우 그 결정에 대하여 행정소송을 제기할 수 있다.", "간접강제 결정에 기초한 강제집행에 관하여 「행정심판법」에 특별한 규정이 없는 사항에 대하여는 「행정기본법」의 규정을 준용한다."], answer:[4]},
  {num:43, round:12, question: "관할 시장 A는 2024. 2. 5. 甲에 대하여 1,000만 원의 과징금부과처분을 하였고, 甲은 2024. 2. 6. 처분서를 수령하였다. 甲은 과징금부과처분 취소심판을 제기하였는데, 관할 행정심판위원회는 2024. 4. 23. 1,000만 원의 과징금부과처분을 700만 원으로 감액하는 일부취소재결을 하여, 해당 재결서의 정본이 2024. 4. 24. 甲에게 송달되었다. 이때 甲이 일부취소재결에도 아직 취소되지 않고 남아있는 부분이 위법하다고 보아 취소소송을 제기하는 경우 소의 대상과 제소기간의 기산일은?", choices:["700만 원으로 감액된 2024. 2. 5. 자 과징금부과처분 / 2024. 4. 24.", "700만 원으로 감액된 2024. 2. 5. 자 과징금부과처분 / 2024. 2. 6.", "700만 원으로 감액한 2024. 4. 23. 자 일부취소재결 / 2024. 4. 24.", "700만 원으로 감액한 2024. 4. 23. 자 일부취소재결 / 2024. 2. 6.", "2024. 2. 5. 자 1,000만 원의 과징금부과처분 / 2024. 2. 6."], answer:[1]},

  {num:45, round:12, question: "권한의 대리와 위임에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 의함)", choices:["권한의 위임은 권한 자체를 수임자에게 이전하지 않는 점에서 권한 자체가 이전되는 권한의 대리와 구별된다.", "국가사무가 도지사에게 기관위임된 경우 도지사가 이를 군수에게 재위임하기 위해서는 도 조례에 의하여야 한다.", "「정부조직법」에 따르면 권한의 위임은 위임기관의 권한의 일부에 한하여 인정된다.", "내부위임에 따라 수임관청이 자신의 이름으로 처분을 한 경우 그 처분에 대한 무효확인 소송의 피고는 위임관청이 된다.", "「행정권한의 위임 및 위탁에 관한 규정」에 따르면 수임사무의 처리에 관하여 위임기관은 수임기관에 대하여 사전승인을 받을 것을 요구할 수 있다."], answer:[3]},

  "1-9": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>물건의 사용대가로 받는 금전은 '법정과실'입니다. '천연과실'은 물건에서 산출되는 것(과일, 우유 등)입니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>①②③④ 모두 옳은 설명입니다.</div>",
  "1-10": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>미성년자의 취소권 행사는 원칙적으로 신의칙에 반하지 않습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 신의칙 위반 여부는 법원이 직권으로 판단할 수 있습니다.<br>② 이사 사임만으로는 사정변경의 원칙이 적용되지 않습니다.<br>④ 국가도 특별한 사정 없으면 소멸시효 완성을 주장할 수 있습니다.<br>⑤ 사정변경은 당사자에게 책임이 없어야 적용됩니다.</div>",
  "1-11": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>무권대리행위는 본인이 추인할 수 있습니다. 추인은 상대방(丙)뿐 아니라 무권대리인에게도 가능합니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>② 추인의 효과(소급효)는 원칙적으로 계약당사자 사이에서 발생합니다. 제3자에게 당연히 미치는 것은 아닙니다.<br>③ 무권대리인이 본인을 상속하면 추인거절권을 상실하고 무권대리행위의 무효를 주장할 수 없습니다.<br>④ 상대방이 무권대리임을 안 경우 철회할 수 없습니다.<br>⑤ 본인이 추인 거절하면 상대방은 무권대리인에게 이행청구는 못 하고 손해배상만 청구 가능합니다.</div>",
  "1-12": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>재판상 청구 후 각하되고 6개월 내 재청구 시 '처음 청구한 때'부터 중단됩니다. '다시 청구한 때'가 아닙니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>①②④⑤ 모두 옳은 설명입니다.</div>",
  "1-13": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>판결 확정된 채권은 10년 시효입니다. 음식료 채권(1년)도 판결 확정되면 10년으로 연장됩니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>①③④⑤ 모두 옳은 설명입니다.</div>",
  "1-14": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>동기의 착오는 동기가 '표시'되기만 하면 됩니다. 별도의 합의가 필요한 것은 아닙니다. 이 보기가 틀렸습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>②③④⑤ 모두 옳은 설명입니다.</div>",
  "1-15": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>이중매매는 배신적 악의(선매수인에게 손해 가할 목적)가 있어야 무효입니다. 단순히 알고 매수한 것만으로는 무효가 아닙니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>②③④⑤ 모두 옳은 설명입니다.</div>",
  "1-16": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>기한의 이익은 '채무자'를 위한 것으로 추정됩니다. 채권자가 아닙니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>①③④⑤ 모두 옳은 설명입니다.</div>",
  "1-17": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>통정허위표시의 무효는 선의의 제3자에게 대항하지 못합니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>①②③⑤ 모두 옳은 설명입니다.</div>",
  "1-18": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>미성년자가 성년 전에 추인하면 효력이 없습니다. 성년 후에 추인해야 유효합니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 의사무능력자 행위는 절대적 무효입니다.<br>② 일부무효 시 원칙적으로 전부 무효입니다.<br>③ 폭리행위는 추인으로 유효가 될 수 없습니다.<br>⑤ 취소권은 추인할 수 있는 날로부터 3년입니다.</div>",
  "1-19": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>판례는 비록 마음속에서 진정으로 원하지는 않았더라도, 당시 상황에서 최선이라고 판단해 내린 결정을 진의라고 봅니다. 5번 지문은 '진의'를 '진정으로 바라는 사항'이라고 설명했기 때문에 틀린 것입니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>①②③④ 모두 옳은 설명입니다.</div>",
  "1-20": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>2013. 3. 23. 13시부터 1개월을 계산하면, 2013. 4. 23. 24시에 기간이 끝납니다. 따라서 지문의 \"4. 24. 24시까지\"는 하루가 더 더해진 잘못된 설명입니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 2013년 6월 30일까지 민법상 성년은 만 20세였습니다. 2013년 7월 1일부터 개정 민법이 시행되면서 성년 기준이 만 19세로 하향되었습니다.<br>②③⑤ 모두 옳은 설명입니다.</div>",
  
  "2-1": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>단순히 권리자가 얻는 이익보다 상대방이 잃는 이익이 현저히 크다는 사정만으로는 권리남용이 인정되지 않으며, 권리행사의 목적이 오직 상대방에게 고통을 주고 손해를 입히려는 데 있어야 합니다.</div>",
  "2-2": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>법인의 불법행위가 성립하더라도 가해행위를 한 대표자는 손해배상책임을 면하지 못하며, 법인과 대표자는 연대하여 책임을 집니다.</div>",
  "2-3": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>법인의 해산과 청산은 법원이 감독하며, 청산인이 감독하는 것이 아닙니다.</div>",
  "2-4": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>상대방 丙은 제한능력자가 능력자가 된 후(19세가 된 甲)에게 1개월 이상의 기간을 정하여 추인 여부의 확답을 촉구할 수 있습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 거절권은 단독행위에 대한 권리입니다. 계약의 경우에는 철회권을 행사해야 합니다.<br>② 취소의 상대방은 직접 법률행위를 한 원래의 상대방인 丙입니다. 전득자 丁이 아닙니다.<br>③ 계약 당시 甲이 미성년자임을 알았던(악의) 상대방 丙은 철회권을 행사할 수 없습니다.<br>④ 미성년자가 속임수를 써서 법정대리인의 동의가 있는 것으로 믿게 한 경우 취소할 수 없습니다(민법 제17조).</div>",
  "2-5": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>특정후견은 본인의 의사에 반하여 할 수 없습니다.</div>",
  "2-6": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>관습법은 법령에 저촉되지 않는 범위 내에서 법칙으로서 효력을 가집니다.</div>",
  "2-7": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>이사가 선임한 대리인은 법인의 기관이 아니라 이사의 대리인에 불과합니다.</div>",
  "2-8": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>주물과 종물은 원칙적으로 동일한 소유자에 속해야 하지만, 법률상 별개의 물건으로 취급됩니다.</div>",
  "2-9": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>급부와 반대급부 사이에 현저한 불균형이 있다고 해서 궁박, 경솔, 무경험으로 인한 행위로 추정되지 않으며, 표의자가 이를 모두 증명해야 합니다.</div>",
  "2-10": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>유동적 무효* 상태인 토지거래계약에서 허가를 받기 전에는 대금 미지급을 이유로 계약을 해제할 수 없습니다.<br><span style='font-size: 12px; color: #78350f;'>* 아직은 무효지만, 나중에 진짜 계약이 될 수도 있는 대기 상태</span></div>",
  "2-11": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>분양가격 결정 기준이 불능이 되고 새로운 합의가 없다면, 계약의 중요 요소가 결여된 것이므로 소유권이전등기를 청구할 수 없습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① '매도인의 해석에 따른다'는 조항은 법원의 해석권을 구속하지 못합니다. 최종 해석권은 사법부에 있습니다.<br>③ 감정이 약정 취지에 반하거나 불합리하면 법원이 배척할 수 있습니다.<br>④ '최대 노력하겠다'는 법적 의무가 아니라 도덕적 의무로 봅니다.<br>⑤ 오표시무해의 원칙: 실제 의사가 甲 토지였다면 甲 토지에 계약이 성립합니다.</div>",
  "2-12": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>통정허위표시에 의한 채권을 가압류한 자는 허위표시를 기초로 새로운 이해관계를 맺은 제3자에 해당합니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 통정은 단순 인식이 아니라 양해나 통정이 있어야 합니다.<br>② 대리인이 통정허위표시를 하면 본인에게 효력이 발생하지 않습니다(무효).<br>③ 누구도 선의의 제3자에게는 무효를 주장할 수 없습니다.<br>④ 파산관재인도 제3자에 해당하며, 파산채권자 전원이 악의가 아닌 한 선의로 봅니다.</div>",
  "2-13": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>상속인이 여러 명인데 한 명인 줄 알고 합의한 것은 동기의 착오 또는 법률 해석의 문제로 보아 중요부분의 착오로 인정하지 않았습니다.</div>",
  "2-14": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>시, 분, 초를 단위로 하는 기간은 자연적 계산법에 따라 즉시부터 기산합니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 기간 계산 규정은 임의규정입니다(민법 제155조).<br>② 연령 계산은 출생일을 산입합니다(초일산입, 민법 제158조).<br>③ 기간은 말일의 종료(24시)로 만료합니다(민법 제160조).<br>⑤ 소급 계산에도 동일한 규정이 적용됩니다.</div>",
  "2-15": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>도달주의 원칙상 의사표시가 도달하여 효력이 발생한 후에는 임의로 철회할 수 없습니다.</div>",
  "2-16": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>계약 체결 대리권을 수여받았다고 해서 그 계약을 해제할 권한까지 당연히 포함되는 것은 아닙니다.</div>",
  "2-17": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>등기신청(공법상 권리)을 기본대리권으로 하여 사법행위를 한 경우에도 권한을 넘은 표현대리가 성립할 수 있습니다.</div>",
  "2-18": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>재판상 청구로 시효가 중단된 경우, 재판이 확정된 때로부터 새로이 시효가 진행합니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>② 건물 미완공은 법률상 장애로 시효가 진행되지 않습니다(권리를 행사할 수 없는 상태).<br>③ 근저당권설정등기청구권은 독자적 시효의 대상입니다(일반적으로 10년).<br>④ 물상보증인 소송 대응만으로는 주채무자에 대한 재판상 청구가 아닙니다.<br>⑤ 승인은 시효 진행 개시 이후에만 가능합니다.</div>",
  "2-19": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>확실한 사실에 의존하는 것은 '기한'이며, 조건은 장래 발생할 사실이 '불확실'한 경우를 말합니다.</div>",
  "2-20": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>시효중단의 효력이 있는 승인에는 상대방의 권리에 관한 처분 능력이나 권한이 있음을 요하지 않습니다.</div>",
  
  "3-1": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>미성년자가 법정대리인 동의 없이 체결한 계약을 취소하는 것은 법이 정한 권리 행사로 신의칙에 반하지 않습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 병원은 환자의 휴대품 도난 방지 등 필요한 조치를 강구할 보호의무가 있습니다.<br>② 소멸시효 항변권 행사도 신의칙에 반하는 경우 권리남용으로 허용되지 않습니다.<br>③ 강행법규 위반자가 스스로 무효를 주장하는 것은 신의칙에 반한다고 할 수 없습니다(사회질서 유지 우선).<br>④ 토지 취득자가 송전선 철거를 청구하는 것이 언제나 권리남용이 되는 것은 아닙니다.</div>",
  "3-2": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>헌법에 의하여 체결된 조약이나 국제법규가 민사에 관한 것이라면 민법의 법원이 됩니다. 이 보기가 틀렸습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 민사법의 적용 순위(법률 → 관습법 → 조리)를 올바르게 설명합니다.<br>③ 종중 구성원의 자격에 대한 대법원 판례(성별 구분 없음) 내용입니다.</div>",
  "3-3": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>가정법원은 피성년후견인이 독자적으로 할 수 있는(취소할 수 없는) 법률행위의 범위를 정할 수 있습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 지자체장도 성년후견 종료 심판을 청구할 수 있습니다.<br>② 일용품 구입 등 일상생활에 필요한 행위는 성년후견인이 취소할 수 없습니다.<br>⑤ 성년후견 개시 심판 시 본인의 의사를 고려해야 합니다.</div>",
  "3-4": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>ㄷ. 상대방은 추인이 있을 때까지 철회권을 행사할 수 있습니다.<br>ㄹ. 제한능력자가 속임수를 써서 능력자로 믿게 한 경우 취소권이 배제됩니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>ㄱ, ㄴ: 능력자가 된 후의 본인이나 법정대리인에게 촉구(확답 요구)하는 것은 유효한 보호 수단입니다.</div>",
  "3-5": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>실질적으로 법인을 운영하며 사실상 대표하는 자(실무상 대표자)의 행위도 직무 관련성이 있다면 법인의 불법행위가 성립합니다. 이 보기가 틀렸습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>④ 피해자가 직무 관련 없음을 악의 또는 중과실로 알지 못한 경우 법인은 책임지지 않습니다.</div>",
  "3-6": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>청산 중인 법인은 채권신고기간 내에는 변제할 수 없으나, 채권신고기간이 경과한 후에는 변제기에 도달하지 않은 채권이라도 변제할 수 있습니다. 이 보기가 틀렸습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>⑤ 청산사무가 남았다면 등기 여부와 상관없이 법인은 존속합니다.</div>",
  "3-7": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>사원총회는 미리 통지한 사항에 대해서만 결의할 수 있는 것이 원칙입니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 이사는 필수기관이나 감사는 임의기관입니다.<br>② 이사가 없거나 결원 시 손해 우려가 있을 때 선임하는 것은 임시이사입니다.</div>",
  "3-8": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>등기하지 않은 수목도 명인방법을 갖추면 독립된 부동산으로 거래할 수 있습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 전기는 관리 가능한 자연력으로 민법상 물건에 해당합니다.<br>④ 천연과실은 원물로부터 분리할 때 수취권자에게 귀속됩니다(일수 비율은 법정과실).</div>",
  "3-9": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>점유의 취득, 유실물 습득, 매장물 발견, 무주물 선점은 모두 사실행위이며 법률행위가 아닙니다.<br>ㄹ. 소유권의 포기는 상대방 없는 단독행위로서 법률행위입니다.</div>",
  "3-10": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>시가에 대한 착오는 특별한 사정이 없는 한 중요 부분의 착오로 보지 않습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 착오 취소는 선의의 제3자에게 대항할 수 없습니다.<br>④ 비진의표시는 상대방이 알았거나 알 수 있었을 때 무효입니다.</div>",
  "3-11": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>채권의 가장양도에서 기존 채무자는 허위표시가 이루어지기 전부터 이미 채무를 지고 있던 자일 뿐, 허위표시를 기초로 새로운 법률상 이해관계를 맺은 자가 아닙니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>①②③④는 모두 가장행위(매매, 전세권설정 등)를 바탕으로 새롭게 소유권, 가등기, 저당권, 가압류 등을 취득했으므로 제3자에 해당합니다.</div>",
  "3-12": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>법률행위가 현저하게 공정을 잃었다고 해서 경솔이나 궁박이 있었다고 추정되지 않습니다. 피해자가 모든 요건을 직접 증명해야 합니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>② 경매는 법원에 의해 공정하게 진행되므로 불공정한 법률행위 규정이 적용되지 않습니다.<br>③ 궁박, 경솔, 무경험은 모두 갖출 필요 없이 하나만 있어도 충분합니다.<br>⑤ 대리인이 계약했을 때 경솔·무경험은 대리인, 궁박은 본인을 기준으로 판단합니다.</div>",
  "3-13": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>유권대리는 대리권이 있는 것이고, 표현대리는 대리권이 없으나 본인이 책임지는 것이므로, 유권대리 주장 속에 표현대리 주장이 포함되어 있다고 볼 수 없습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>② 대리권 소멸 후의 표현대리는 법정대리에도 적용됩니다.<br>③ 표현대리가 인정되어 본인이 책임질 뿐, 무권대리라는 성질이 유권대리로 바뀌는 것은 아닙니다.</div>",
  "3-14": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>복대리권은 대리인의 대리권을 기초로 하므로, 대리인의 대리권이 소멸하면 복대리권도 함께 소멸합니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 복대리인은 대리인이 선임하지만, 본인의 대리인입니다.<br>③ 복대리인은 본인에 대해 대리인과 같은 권리의무가 있습니다.</div>",
  "3-15": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>상대방이 계약 당시 무권대리임을 알았더라도(악의), 본인에 대하여 추인 여부의 확답을 최고할 수 있습니다. (단, 철회는 선의자만 가능합니다.)</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>② 추인은 무권대리인이나 상대방 누구에게나 할 수 있습니다.<br>⑤ 본인이 무권대리인에게 추인했더라도 상대방이 그 사실을 몰랐다면 여전히 철회할 수 있습니다.</div>",
  "3-16": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>무권대리인(乙)이 제한능력자(미성년자)인 경우, 상대방(丙)은 乙에게 계약의 이행이나 손해배상을 청구할 수 없습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>② 대리인은 능력자임을 요하지 않으므로 미성년자임을 이유로 대리행위를 취소할 수 없습니다.<br>③ 대리권은 계약 체결권이지, 계약을 해제할 권한까지 포함하는 것은 아닙니다.</div>",
  "3-17": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>정지조건이 있는 법률행위는 조건이 성취한 때로부터 효력이 생깁니다 (잃는 것이 아님). 이 보기가 틀렸습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>④ 조건이 불법인 경우 조건만 무효가 아니라 법률행위 전체가 무효가 됩니다.<br>⑤ 불가능한 사실도 이행기한으로 정했다면, 그 불능이 확정된 때 기한이 도래한 것으로 봅니다.</div>",
  "3-18": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>기간의 기산일은 공휴일이라도 그대로 계산하며, 기간의 만료일이 공휴일인 경우에만 그 다음 날로 만료됩니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>② 연령 계산 시에는 출생일(초일)을 산입합니다. 1996년 6월 5일생은 2015년 6월 5일 0시에 만 19세(성년)가 됩니다.<br>⑤ 시간 단위로 정한 기간은 즉시 기산합니다(10시간 후 반환).</div>",
  "3-19": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>시효중단 사유인 승인은 관리 권한만 있으면 충분하며, 처분의 능력이나 권한이 있을 것을 요하지 않습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 재판상 청구 후 소 취하 시 6개월 내에 다시 청구하지 않으면 중단 효력이 없습니다.<br>③ 부부간의 권리는 혼인 관계 종료 후 6개월까지 시효가 완성되지 않고 정지됩니다.</div>",
  "3-20": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>쌍방이 허가 신청을 하지 않기로 명백히 의사를 표시했다면, 그 계약은 확정적으로 무효가 됩니다 (유효가 아님).</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 허가 전이라도 계약금 배액을 상환하고 해제하는 해약금 해제는 가능합니다.<br>③ 유동적 무효 상태에서는 이미 지급한 계약금을 부당이득으로 돌려달라고 할 수 없습니다.</div>",
  "4-1": "<div class='exp-section'><strong>✓ 정답 해설 (④: ㄱ, ㄷ, ㄹ)</strong><br>ㄱ. 병원은 입원 계약의 부수적 의무로서 환자의 휴대품 도난 방지를 위한 적절한 조치를 취할 신의칙상 보호의무가 있습니다.<br>ㄷ. 단순히 '9년 경과'와 '시가 상승'만으로는 계약을 해제할 만한 사정변경에 해당하지 않습니다.<br>ㄹ. 실효의 원칙은 소송법상 권리(항소권 등)에도 적용될 수 있습니다.</div><div class='exp-section'><strong>✗ 오답 해설 (ㄴ)</strong><br>ㄴ. 인지청구권은 포기할 수 없는 일신전속적인 신분상 권리입니다. 오랫동안 행사하지 않았다고 해서 실효되지 않으므로 실효의 법리가 적용되지 않습니다.</div>",
  "4-2": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>우리 민법은 외국인의 권리능력에 관한 별도의 명문규정을 두고 있지 않습니다. 개별 법령에 의해 제한되지 않는 한 외국인의 권리능력을 인정하는 것이 통설적 입장입니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① '동시에 사망한 것으로 본다(간주)'가 아니라 '추정한다'입니다. 추정은 반대 증거로 번복 가능하지만 간주는 불가능합니다.<br>② 태아는 모든 법률관계가 아니라 불법행위 손해배상·상속·유증 등 법률에 특별한 규정이 있는 경우에만 예외적으로 권리능력이 인정됩니다.<br>③ 권리능력은 살아있는 사람이면 누구나 가지며, 의사능력 유무와 무관합니다. 갓 태어난 아기나 치매 환자도 권리능력은 있습니다.<br>④ 도선법 제5조에 따라 대한민국 국적을 가지지 않은 자는 도선사가 될 수 없습니다.</div>",
  "4-3": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>민법 제14조의2 제2항은 특정후견은 본인의 의사에 반하여 할 수 없다고 명시합니다. 특정후견은 세 가지 후견 유형 중 본인의 자율성을 가장 존중하는 제도입니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 후견 개시는 본인·배우자·4촌 이내 친족·검사·지자체장 등의 청구가 있어야 하며, 법원이 직권으로 개시할 수 없습니다.<br>② 후견 종료 심판은 그때부터 효과가 발생하는 장래효를 가지며, 과거 행위에 소급하지 않습니다.<br>④ 법원은 피성년후견인의 상태를 고려하여 취소할 수 없는 법률행위의 범위를 정할 수 있습니다.<br>⑤ 돌볼 가족이 없는 경우를 대비하여 지자체장에게도 청구권을 부여하여 복지 사각지대를 방지합니다.</div>",
  "4-4": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>특별실종의 사망 간주 시점은 '실종선고일로부터 1년'이 아니라 위난이 종료한 후 실종기간(1년)이 만료한 때입니다. '실종선고일'이 아닌 '위난 종료 후 실종기간 만료 시'가 핵심입니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 법원이 선임한 재산관리인은 관리 업무 시작 전 재산 범위를 확정하기 위해 재산목록을 작성해야 합니다.<br>③ 실종선고는 사적 법률관계(상속·혼인 등) 정리를 위한 제도이므로 형사법적 책임에는 영향을 미치지 않습니다.<br>④ 실종선고는 사망을 간주하는 강력한 효과가 있어, 반드시 '실종선고 취소 판결'을 받아야만 효과를 뒤집을 수 있습니다.<br>⑤ 부재자가 본인 의사로 선임한 관리인은 법정대리인이 아닌 임의대리인입니다.</div>",
  "4-5": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>대표자의 행위가 직무에 관한 것이 아님을 피해자가 중대한 과실로 알지 못한 경우에는 법인에게 불법행위책임을 물을 수 없습니다. 피해자에게 악의 또는 중과실이 있으면 법인의 책임이 면제됩니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 법인은 정관으로 정한 목적 범위 내에서 권리의무의 주체가 됩니다.<br>② 피용자의 사무집행 중 불법행위에 대해 법인은 민법 제756조의 사용자책임을 부담합니다.<br>③ 목적 범위 외의 행위로 손해가 발생하면 의결에 찬성하거나 집행한 사원·이사 등이 연대하여 배상해야 합니다.<br>⑤ 민법 제35조의 대표자에는 형식적 명칭과 관계없이 실질적으로 법인을 운영하며 사무를 집행하는 사람도 포함됩니다.</div>",
  "4-6": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>민법 제52조에 따라 주사무소를 관할구역 외로 이전할 경우, 구소재지에서 3주 내 이전등기, 신소재지에서 3주 내 설립등기 사항을 등기해야 합니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 비영리 사단법인 설립에는 신고가 아닌 주무관청의 허가가 필요합니다(허가주의).<br>② 이사가 없어 손해 우려가 있을 때 선임하는 것은 '특별대리인'이 아니라 '임시이사'입니다. 특별대리인은 법인과 이사의 이익이 상반될 때 선임합니다.<br>④ 이사의 대표권 제한은 반드시 정관에 기재해야 효력이 있으며, 제3자에게 대항하려면 등기까지 마쳐야 합니다.<br>⑤ 법인의 감사는 필수기관이 아닌 임의기관으로, '둘 수 있을' 뿐 '두어야 하는' 것이 아닙니다.</div>",
  "4-7": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>법인의 존립시기나 해산사유는 재단법인과 사단법인 모두에서 임의적 기재사항입니다. 정할 경우에만 기재하면 되는 사항이지 반드시 기재해야 하는 필요적 기재사항이 아닙니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>② 사단법인의 정관 변경은 주무관청의 허가가 없으면 효력이 없습니다.<br>③ 재단법인 설립자가 명칭·사무소소재지·이사임면 방법을 정하지 않고 사망한 경우, 이해관계인 또는 검사의 청구에 의해 법원이 정합니다.<br>④ 사단법인 정관 변경은 정관에 다른 규정이 없는 한 총사원 3분의 2 이상의 동의가 필요합니다.<br>⑤ 재단법인의 목적을 달성할 수 없는 때에는 주무관청 허가를 얻어 목적 기타 정관의 규정을 변경할 수 있습니다.</div>",
  "4-8": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>강제집행을 면할 목적으로 허위의 근저당권설정등기를 경료하는 행위는 반사회질서의 법률행위(민법 제103조)에 해당하지 않습니다. 이는 통정허위표시(제108조)로서 무효가 될 수 있을지언정, 사회질서 위반 행위는 아니라는 것이 대법원 판례의 입장입니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 반사회질서 여부는 법률행위시를 기준으로 판단합니다.<br>② 사회통념상 허용 한도를 초과한 고율의 이자 약정은 초과 부분에 한하여 무효입니다.<br>③ 부첩관계 해소 시 위자료·생활대책 약정은 공서양속에 반하지 않아 유효합니다.<br>④ 채권자 이익에 비해 과도하게 무거운 위약벌은 공서양속에 반하여 일부 또는 전부 무효가 됩니다.</div>",
  "4-9": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>민법 제111조 제2항에 따라, 의사표시자가 통지를 발송한 후 사망하거나 행위능력을 상실하더라도 의사표시의 효력에는 영향을 미치지 않습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>② 진의 아닌 의사표시에서 상대방이 진의아님을 알았거나 알 수 있었을 경우 그 의사표시는 취소가 아니라 무효가 됩니다.<br>③ 공시송달은 표의자에게 과실이 없는 경우에만 허용됩니다. 과실이 있으면 공시송달의 효력이 인정되지 않습니다.<br>④ 상대방이 있는 의사표시는 요지(了知)한 때가 아니라 도달한 때에 효력이 생깁니다(도달주의).<br>⑤ 제3자가 강박을 행한 경우, 상대방이 그 사실을 알았거나 알 수 있었을 때(과실 포함) 취소할 수 있습니다. '알았던 경우에 한하여'라는 표현이 틀렸습니다.</div>",
  "4-10": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>통정허위표시에서 제3자는 선의이기만 하면 보호되며, 무과실까지 요구되지 않습니다. 제3자가 사정을 알지 못한 데에 과실이 있더라도 선의이기만 하면 보호받을 수 있습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 통정허위표시는 당사자 사이에서 무효이나, 선의의 제3자에게는 무효를 대항하지 못합니다.<br>③ 제3자는 선의로 추정되므로, 악의라는 사실의 주장·입증책임은 무효를 주장하는 자에게 있습니다.<br>④ 허위매매의 매수인으로부터 저당권을 설정받은 자는 새로운 법률상 이해관계를 맺었으므로 선의의 제3자에 해당합니다.<br>⑤ 허위로 설정된 전세권에 대해 저당권을 취득한 자도 선의라면 제3자로 보호받습니다.</div>",
  "4-11": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>민법 제123조 제2항에 따라, 복대리인은 그 권한 내에서 본인을 대리하며, 본인이나 제3자에 대하여 대리인과 동일한 권리의무가 있습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 복대리인은 대리인이 선임하지만 '대리인의 대리인'이 아니라 '본인의 대리인'입니다.<br>② 대리권 범위가 불분명한 경우, 보존행위와 이용·개량행위는 할 수 있지만 처분행위는 할 수 없습니다.<br>③ 자기계약은 원칙적으로 금지되지만, 본인의 허락이 있으면 가능합니다.<br>④ 임의대리권은 원인된 법률관계가 존속하더라도 본인이 수권행위를 철회하여 소멸시킬 수 있습니다.</div>",
  "4-12": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>권한을 넘은 표현대리(제126조)의 기본대리권은 반드시 법률행위의 대리권이어야 합니다. 고객 유치·투자상담·권유 등 단순한 사실행위는 기본대리권이 될 수 없으므로, 이를 기초로 표현대리가 성립할 수 없습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 유권대리 주장과 표현대리 주장은 별개이므로, 유권대리 주장 속에 표현대리 주장이 포함되지 않습니다.<br>② 대리권 소멸 후 표현대리(제129조)는 과거에 대리권이 있었던 경우에만 적용되므로, 처음부터 대리권이 없었던 자에게는 성립할 수 없습니다.<br>④ 무권대리 계약은 본인이 추인하지 않으면 본인에게 효력이 없습니다.<br>⑤ 계약 당시 무권대리임을 알았던(악의) 상대방은 철회권을 행사할 수 없습니다.</div>",
  "4-13": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>상대방(丙)의 최고에 대해 본인(甲)이 확답을 발하지 않은 경우, 민법 제131조에 따라 추인한 것이 아니라 추인을 거절한 것으로 봅니다. '추인한 것으로 본다'는 표현이 틀렸습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 甲이 추인하기 전에 이미 丁이 소유권이전등기를 마쳤으므로, 그 후 추인이 있어도 丁의 소유권 취득에는 영향이 없습니다.<br>② 본인은 적극적으로 추인 거절 의사를 표시하여 무권대리 행위를 확정적으로 무효화할 수 있습니다.<br>③ 계약 당시 대리권 없음을 알지 못한 선의의 丙은 추인 전에 乙을 상대로 계약을 철회할 수 있습니다.<br>⑤ 무권대리인은 과실이 없어도 상대방의 선택에 따라 이행 또는 손해배상 책임을 집니다(제135조).</div>",
  "4-14": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>토지거래허가구역 내의 계약에서 당사자는 공동허가신청에 협력할 의무가 있으며, 일방이 이를 위반할 경우 상대방은 협력의무의 이행을 소송으로 강제(소구)할 수 있습니다. '소구할 수 없다'는 표현이 틀렸습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 허가 전에는 채권적 효력(이행 청구 등)이 전혀 발생하지 않습니다.<br>② 처음부터 허가를 배제하거나 잠탈하려는 계약은 확정적 무효로 유효화될 여지가 없습니다.<br>③ 허가 전에는 대금 지급 의무 자체가 없으므로, 미지급을 이유로 계약을 해제할 수 없습니다.<br>④ 허가 협력 의무와 대금 지급 의무는 동시이행 관계가 아니며, 협력 의무가 선행됩니다.</div>",
  "4-15": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>주물과 종물에 관한 민법 제100조 제2항은 권리 상호간에도 유추 적용될 수 있습니다(예: 건물과 대지사용권). '적용될 수 없다'는 표현이 틀렸습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 민법상 물건에는 유체물과 전기·열 등 관리 가능한 자연력이 포함됩니다.<br>② 주물과 종물은 운명을 같이 하므로, 주물에 대한 압류의 효력은 종물에도 미칩니다.<br>④ 주종 처분 일체성은 강행규정이 아니므로, 특약으로 종물을 제외하거나 종물만 별도 처분할 수 있습니다.<br>⑤ 법정과실은 존속기간일수의 비율로, 천연과실은 원물로부터 분리할 때 수취권자에게 귀속됩니다.</div>",
  "4-16": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>법률행위가 취소되면 처음부터 무효인 것으로 됩니다. 다만, 제한능력자는 선의·악의를 불문하고 그 행위로 인하여 받은 이익이 현존하는 한도에서만 상환할 책임이 있습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 무효인 법률행위의 추인은 명시적·묵시적 방법 모두 가능합니다.<br>③ 취소권은 상속되므로, 피상속인의 착오를 이유로 상속인도 취소권을 행사할 수 있습니다.<br>④ 취소권은 추인할 수 있는 날로부터 3년, 법률행위를 한 날로부터 10년 내에 행사해야 합니다. '10년'만 언급한 것이 틀렸습니다.<br>⑤ 일부 무효 시, 그 무효 부분이 없어도 법률행위를 하였을 것이라고 인정되면 나머지 부분은 유효합니다.</div>",
  "4-17": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>\"3년 안에 甲이 사망하면\"은 발생 여부가 불확실하므로 조건에 해당합니다. 만약 단순히 \"甲이 사망하면\"이었다면 반드시 발생하는 사건이므로 불확정기한이 됩니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 조건 성취 방해는 고의뿐만 아니라 과실에 의한 경우도 포함되므로, 상대방은 조건이 성취된 것으로 주장할 수 있습니다.<br>② 정지조건 성취의 효력은 원칙적으로 성취한 때부터 발생하지만, 당사자의 의사로 소급시킬 수 있습니다.<br>③ 불법조건은 조건만 무효가 아니라 법률행위 전체가 무효가 됩니다.<br>⑤ 조건 성취가 미정한 권리도 일반 규정에 의하여 처분·상속·보존·담보 등이 가능합니다.</div>",
  "4-18": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>연령 계산 시 출생일(초일)을 산입하며, 생일이 되는 날 0시부터 해당 나이에 도달합니다. 1997년 6월 1일생은 2016년 6월 1일 0시부터 만 19세(성년)가 됩니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 기산일이 공휴일이어도 그대로 기산합니다. 만료일이 공휴일인 경우에만 다음 날로 만료됩니다.<br>② 초일 불산입 규정은 강행규정이 아닌 임의규정으로, 당사자 약정으로 달리 정할 수 있습니다.<br>③ 4월 30일부터 2개월은 역법에 따라 6월 30일 24시에 만료됩니다. 기산 시각(10시)은 관계없습니다.<br>④ 7월 19일 총회라면 7월 11일 24시(12일 0시)까지 발신해야 12일~18일까지 7일이 확보됩니다. '12. 24시'는 틀렸습니다.</div>",
  "4-19": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>시효 중단의 원칙은 채권자가 채무자를 상대로 권리를 행사했을 때에만 발생합니다. 물상보증인은 자신의 물건을 담보로 내놓았을 뿐, 직접적인 빚을 갚을 채무를 부담하는 사람은 아닙니다. 따라서 물상보증인이 제기한 소송에서 채권자가 응소하여 권리를 주장하더라도, 실제 채무자의 소멸시효는 중단되지 않고 그대로 진행됩니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>② 비법인사단의 총유물 매매 결의에는 그에 따른 채무 부담과 이행을 승인하는 내용까지 포함된 것으로 봅니다. 따라서 대표자가 매매와 관련된 채무를 승인하거나 이행할 때, 별도의 사원총회 결의를 다시 거칠 필요는 없습니다. 결과적으로 대표자가 적법하게 채무를 승인했다면, 사원총회 결의가 없었더라도 소멸시효 중단의 효력이 정상적으로 발생합니다.<br>③ 물상보증인 부동산에 대한 경매 신청의 시효중단 효력이 채무자에게 미치려면 채무자에게 압류 사실이 통지되어야 합니다.<br>④ 시효이익의 포기는 상대적이므로, 채무자가 포기해도 제3취득자는 독자적으로 소멸시효 완성을 주장할 수 있습니다.<br>⑤ 가압류에 의한 시효중단은 가압류 집행이 해제·종료된 때부터 새롭게 시효가 진행됩니다(기입등기일부터가 아닙니다).</div>",
  "4-20": "<div class='exp-section'><strong>✓ 정답 해설 (②: ㄱ, ㄷ, ㅁ)</strong><br>ㄱ. 의사의 치료에 관한 채권 → 3년 단기소멸시효<br>ㄷ. 도급받은 자의 공사에 관한 채권 → 3년 단기소멸시효<br>ㅁ. 상인이 판매한 상품의 대금채권 → 3년 단기소멸시효</div><div class='exp-section'><strong>✗ 제외된 항목</strong><br>ㄴ. 노역인의 임금 채권 → 1년의 단기소멸시효(민법 제164조)<br>ㄹ. 2년 후 원금·이자를 한꺼번에 받기로 한 이자채권 → 1년 이내의 주기로 지급하기로 한 채권이 아니므로 10년의 일반 시효 적용</div>",
  
  "5-1": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>사실인 관습은 법원(法源)이 아니며, 법령과 같은 효력을 갖지 못합니다. 관습법만이 법원으로서의 효력을 인정받습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>①②④⑤ 모두 옳은 설명입니다.</div>",
  "5-2": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>이사가 회사 재직 중 채무액이 특정된 '확정채무'를 보증한 경우에는 사임했다는 이유만으로 보증계약을 해지할 수 없습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 제한능력자 제도는 강행규정이므로 이를 이유로 취소하는 것은 신의칙 위반이 아닙니다.<br>③ 무권대리인이 본인을 상속한 후 추인을 거절하는 것은 금반언의 원칙에 반합니다.<br>⑤ 신의칙은 강행규정으로 법원이 직권으로 판단할 수 있습니다.</div>",
  "5-3": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>ㄱ, ㄷ, ㅁ이 옳습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>ㄴ. 취소된 법률행위는 처음부터(소급하여) 무효가 됩니다.<br>ㄹ. 계약은 철회, 단독행위는 거절: 상대방은 계약에 대해선 철회권을, 단독행위에 대해선 거절권을 가집니다. <br> 선의/악의 차이: 계약 철회는 상대방이 **몰랐을 때(선의)**만 가능하지만, 단독행위 거절은 알았어도(악의) 가능합니다. <br>추인 전까지만: 두 권리 모두 제한능력자 측에서 해당 행위를 추인(확정적 유효로 인정)하기 전까지만 행사할 수 있습니다.</div>",
  "5-4": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>재산관리인이 법원의 허가를 얻어 행한 처분행위는, 그 후 부재자가 사망했거나 실종기간이 만료되었더라도 선임 결정이 취소되기 전이라면 유효합니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 실종선고를 받으면 사망한 것으로 '간주'되므로 반증만으로는 효과를 뒤집을 수 없고 실종선고 취소 절차를 밟아야 합니다.<br>② 사후 허가(추인)도 가능합니다.<br>③ 보존행위는 법원의 허가 없이 할 수 있습니다.<br>⑤판결은 유효: 실종선고 전에는 여전히 생존자로 취급되어 당사자 능력이 있으므로, 실종자를 대상으로 한 판결은 유효합니다.<br>소급효 예외: 실종선고로 사망 간주 효과가 발생하더라도, 선고 전 이미 확정된 판결의 효력은 부정되지 않습니다.</div>",
  "5-5": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>ㄱ. 비법인사단도 대표자의 직무상 불법행위에 대해 책임을 집니다.<br>ㄷ. 비법인사단은 설립등기를 하지 않아 등기부가 없으므로, 대표권 제한을 등기해야 한다는 민법 제60조 규정이 적용되지 않습니다.(등기 규정 적용 불가)<br>등기를 할 수 없기 때문에, 상대방이 대표권 제한 사실을 **알았거나 알 수 있었을 경우(악의 또는 과실)**에 한하여 그 거래를 무효로 할 수 있습니다.(대항 요건)</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>ㄴ. 비법인사단도 임시이사에 관한 규정이 유추적용됩니다.<br>ㄹ. 단순한 채무보증은 총유물의 관리·처분행위가 아니라는 것이 판례입니다.<br>ㅁ. </div>",
  "5-6": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>법인의 권리능력을 벗어난 행위로 법인의 불법행위가 성립하지 않더라도, 그 사항을 의결하거나 집행한 대표기관은 개인적으로 책임을 부담합니다.</div>",
  "5-7": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>주물과 종물을 함께 처분하는 것은 원칙이나, 당사자 간의 특약으로 종물만 따로 처분하는 것은 얼마든지 가능합니다(임의규정).</div>",
  "5-8": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>초일불산입 원칙에 따라 초일이 공휴일인지는 기산에 영향을 주지 않으며, 기간의 익일부터 기산합니다.</div>",
  "5-9": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>일부 추인이나 내용을 변경한 추인은 상대방의 동의가 없으면 무효입니다.</div>",
  "5-10": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>증인이 통상적으로 용인되는 수준(여비 등)을 넘어서는 대가를 받기로 약정하는 것은 사회질서 위반(민법 103조)으로 무효입니다.</div>",
  "5-11": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>불공정한 법률행위는 궁박, 경솔, 무경험 중 하나만 구비되어도 성립합니다. 세 가지 모두 충족해야 하는 것은 아닙니다.</div>",
  "5-12": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>통정허위표시의 무효로 대항할 수 없는 제3자는 '선의'이면 족하고 '무과실'까지는 요하지 않습니다.</div>",
  "5-13": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>착오 취소에서 표의자에게 '중대한 과실'이 있다는 점은 취소를 저지하려는 상대방이 입증해야 합니다.</div>",
  "5-14": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>제3자의 사기로 계약을 체결한 경우, 계약을 취소하지 않고도 제3자에게 불법행위에 따른 손해배상을 청구할 수 있습니다.</div>",
  "5-15": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>부동산 입찰에서 이해관계가 대립하는 2인 이상의 대리인이 된 경우(쌍방대리 금지 위반) 그 입찰은 무효입니다.</div>",
  "5-16": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>본인의 사망은 대리권 소멸사유이지만, 본인의 성년후견개시는 소멸사유가 아닙니다. (대리인의 성년후견개시는 소멸사유입니다.)</div>",
  "5-17": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>권한을 넘은 표현대리(126조)에서 기본대리권에는 임의대리권뿐만 아니라 법정대리권도 포함됩니다.</div>",
  "5-18": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>해제조건부 법률행위에서 조건이 이미 성취할 수 없는 것(불능조건)이면 그 법률행위는 조건 없는 법률행위로서 유효가 됩니다.</div>",
  "5-19": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>미성년자는 아직 능력자가 아니므로 단독으로 추인할 수 없지만, 법정대리인은 언제든지 추인할 수 있습니다.</div>",
  "5-20": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>무효인 법률행위의 추인은 원칙적으로 '그때부터' 유효하며, 제3자와의 관계에서 소급하여 유효가 되지 않습니다.</div>",
  "5-21": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>상대방이 이행을 청구하는 것은 취소권자가 한 행위가 아니므로 법정추인 사유가 아닙니다.</div>",
  "5-22": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>단기소멸시효에 걸리는 채권이라도 판결에 의해 확정되면 소멸시효는 10년으로 연장됩니다.</div>",
  "5-23": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>의사의 치료비 채권은 3년의 단기소멸시효에 해당합니다. 나머지(임금, 숙박료 등)는 1년입니다.</div>",
  "5-24": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>채무불이행에 따른 손해배상청구권의 소멸시효는 채무불이행 시(이행기 도래 시)부터 진행합니다.</div>",
  "5-25": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>이사의 임면 방법은 정관 기재 사항이나, 이사 자격의 득실은 필요적 기재 사항이 아닙니다.</div>",

  "6-1": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>동시사망으로 추정되는 경우에도 대습상속의 요건을 갖추었다면 대습상속은 인정된다는 것이 판례의 입장입니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 가족관계등록부의 기재는 추정력이 있을 뿐이며, 반증에 의해 번복될 수 있습니다.<br>③ 태아는 부(父)의 사망에 따른 위자료 청구에 있어서는 이미 출생한 것으로 봅니다.<br>④ 태아가 사산된 경우, 소급하여 권리능력이 없는 것으로 봅니다(정지조건설).<br>⑤ 실종선고를 받은 자는 기간 만료 시에 사망한 것으로 '본다(간주)'입니다.</div>",
  "6-2": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>관습법은 사회구성원들이 그 관행의 법적 구속력에 대하여 확신을 갖지 않게 되었다면 법적 규범으로서의 효력이 부정됩니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>①③④⑤ 모두 관습법에 관한 옳은 설명입니다.</div>",
  "6-3": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>비법인사단의 대표자가 사원총회의 결의를 거쳐야 하는 재산의 처분행위를 결의 없이 한 경우, 제126조 표현대리 규정은 준용되지 않는다는 것이 판례의 태도입니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>①②③⑤ 모두 비법인사단에 관한 옳은 설명입니다.</div>",
  "6-4": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>피성년후견인의 행위라도 일상생활에 필요하고 그 대가가 과도하지 아니한 법률행위는 성년후견인이 취소할 수 없습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 성년후견개시는 본인, 배우자 등의 청구가 있어야 하며 직권으로 할 수 없습니다.<br>② 일시적 결여가 아닌 '지속적' 결여여야 합니다.<br>③ 성년후견인은 법인도 될 수 있습니다.<br>⑤ 범위 변경 역시 청구권자의 청구가 있어야 합니다.</div>",
  "6-5": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>등기된 입목은 토지와 독립된 부동산으로 취급되므로, 토지와 독립하여 거래(매매, 저당권 설정 등)의 객체가 될 수 있습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 판례는 국립공원 입장료는 토지의 사용 대가(법정과실)가 아니라, 국립공원 관리 업무에 소요되는 비용을 충당하기 위한 징수금으로 봅니다.<br>③ (집합물 양도담보) 종류, 장소, 수량을 정해 범위를 특정하면, 그 안의 물건 전체를 하나의 물건으로 보아 담보로 잡을 수 있습니다.<br>(효력 유지) 울타리 안의 개별 물건(돼지 등)이 새로 교체되더라도, 특정된 집합물로서의 담보권 효력은 현재의 물건에 그대로 미칩니다.<br>④⑤ 모두 물건에 관한 옳은 설명입니다.</div>",
  "6-6": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>ㄱ. 상대방 丙이 甲의 사기를 알았거나 알 수 있었을 경우 乙은 취소할 수 있습니다.<br>ㄷ. 乙은 계약을 취소하지 않고도 기망행위자인 甲에게 불법행위로 인한 손해배상을 청구할 수 있습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>ㄴ. 丙이 선의·무과실이라면 乙은 취소권을 행사할 수 없습니다.</div>",
  "6-7": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>대표자의 행위가 직무에 해당하지 않음을 피해자가 중대한 과실로 알지 못한 경우에는 법인에게 손해배상책임을 물을 수 없습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>①②③⑤ 모두 법인의 대표권에 관한 옳은 설명입니다.</div>",
  "6-8": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>이사의 임면에 관한 사항은 정관의 '필요적' 기재사항입니다. 임의적 기재사항이 아닙니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>②③④⑤ 모두 사단법인 기관에 관한 옳은 설명입니다.</div>",
  "6-9": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>ㄱ. (대리인은 능력자일 필요가 없음) 민법 제117조에 따라 대리인은 행위능력자임을 요하지 않습니다. 따라서 을이 피한정후견인(제한능력자)이라도 갑이 대리권을 주었다면 그 계약은 유효하게 갑에게 효력이 미칩니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>ㄴ. (공동대리 원칙 위반) 대리인이 여럿일 때 수권행위로 **'공동으로 하라'**고 정했다면 반드시 함께 의사를 결정해야 합니다. 을이 단독으로 결정했다면 이는 **권한을 넘은 대리행위(무권대리)**가 되어 원칙적으로 갑에게 효력이 미치지 않습니다.<br>ㄷ. (대리인 기준 판정) 이중매매가 반사회적 법률행위(제103조 무효)인지 판단할 때, 하자 유무는 대리인(乙)을 기준으로 합니다. 본인(甲)이 몰랐더라도 대리인(乙)이 적극 가담했다면 그 계약은 무효이며, 무효인 계약의 효력은 갑에게 미칠 수 없습니다.</div>",
  "6-10": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>도달은 상대방이 통지를 현실적으로 수령하거나 내용을 알아야 하는 것(요지)이 아니라, 객관적으로 알 수 있는 상태에 놓인 것을 의미합니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>①③④⑤ 모두 의사표시 효력에 관한 옳은 설명입니다.</div>",
  "6-11": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>반사회질서 법률행위의 무효는 절대적 무효이므로, 선의의 제3자에게도 그 무효를 주장할 수 있습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 강제집행 면탈 목적의 허위 근저당 설정은 반사회적 행위가 아닙니다(통정허위표시 문제).<br>② 증언거부권 유무와 상관없이 허위 증언 대가 약정은 무효입니다.<br>③ 동기가 사회질서에 반하고 그것이 표시되거나 알려진 경우 무효가 됩니다.<br>④ 어떤 일이 있어도 이혼하지 않겠다는 약정은 개인의 자유를 극도로 제한하여 무효입니다.</div>",
  "6-12": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>급부와 반대급부의 현저한 불균형은 구체적 사안에 따라 사회통념에 맞게 판단해야 하며, 산술적으로 일률적인 기준이 있는 것은 아닙니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>①②③④ 모두 불공정한 법률행위에 관한 옳은 설명입니다.</div>",
  "6-13": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>형성권의 특징: 상대방의 승낙이나 동의 없이, 권리자의 일방적인 의사표시만으로도 법률관계가 발생·변경·소멸하는 강력한 권리입니다.<br>해당 지문: ㄱ(추인), ㄴ(취소), ㄷ(상계), ㄹ(해제) 모두 권리자의 통보 즉시 법적 효과가 나타나므로 전부 형성권에 해당합니다.</div>",
  "6-14": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>장래 발생할 것이 확실한 사실은 '기한'이며, '조건'은 발생 여부가 불확실한 사실에 의존하는 부관입니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>②③④⑤ 모두 조건과 기한에 관한 옳은 설명입니다.</div>",
  "6-15": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>주채무자가 시효이익을 포기하더라도 보증인에게는 그 효력이 미치지 않습니다. 보증인은 독자적으로 주채무의 시효완성을 주장할 수 있습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>①②④⑤ 모두 시효이익 포기에 관한 옳은 설명입니다.</div>",
  "6-16": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>ㄱ. 제3자의 실질적 파악: 판례는 제3자를 판단할 때 단순히 형식적으로 보지 않습니다. 허위표시에 의해 형성된 법률관계를 토대로 새로운 법률상의 이해관계를 가졌는지를 실질적으로 따져봅니다. 예를 들어, 가짜 계약인 걸 모르고 그 물건을 사거나 저당을 잡은 사람 등이 여기에 해당합니다.<br>ㄴ. 제3자의 선의 추정: 민법상 제3자는 특별한 증거가 없는 한 '아무것도 몰랐던 것(선의)'으로 추정됩니다. 따라서 '저 사람은 다 알고 있었으니 소유권을 돌려받아야겠다'라고 주장하는 가장매도인(허위표시를 한 사람) 측에서 제3자가 '알고 있었다(악의)'는 사실을 직접 증명해야 합니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>ㄷ. 무효 주장 가능: 허위표시는 당사자 사이에서는 언제나 무효입니다. 따라서 허위표시를 한 당사자(가장매도인이나 가장매수인)는 서로에게 이 계약이 가짜이므로 무효라는 사실을 얼마든지 주장할 수 있습니다. 다만, 이 무효를 가지고 **'모르고 산 제3자(선의의 제3자)'**에게만 대항(주장)하지 못할 뿐입니다.</div>",
  "6-17": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>법정대리인은 자기 책임으로 복대리인을 선임할 수 있으나, 부득이한 사유로 선임한 때에는 선임·감독에 관한 책임만 집니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 복임행위가 철회되면 복대리권은 소멸합니다.<br>② 법정대리인은 언제든지 선임할 수 있습니다(임의대리와의 차이점).<br>④ 본인 지명 시에는 통지·해임 태만 시에만 책임집니다.<br>⑤ 복대리인에 대해서도 표현대리가 성립할 수 있습니다.</div>",
  "6-18": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>추인은 무권대리인뿐만 아니라 상대방 및 그 무권대리행위로 인한 권리의 승계인(전득자)에 대해서도 할 수 있습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>①②③④ 모두 무권대리 추인에 관한 옳은 설명입니다.</div>",
  "6-19": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>표현대리가 성립하는 경우, 본인은 전적인 책임을 져야 하며 상대방에게 과실이 있더라도 과실상계의 법리를 유추적용하여 책임을 감경할 수 없습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>①②③⑤ 모두 표현대리에 관한 옳은 설명입니다.</div>",
  "6-20": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>기간의 말일이 토요일 또는 공휴일에 해당한 때에는 그 '익일(다음날)'로 만료합니다. 전일이 아닙니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>①②③④ 모두 기간 계산에 관한 옳은 설명입니다.</div>",
  "6-21": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>취소할 수 있는 법률행위의 추인은 그 행위가 취소할 수 있는 것임을 알고서 하여야 효력이 발생합니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 취소의 의사표시는 특별한 방식이 필요 없습니다.<br>② 취소된 행위는 처음부터 무효가 되므로 무효행위 추인의 요건으로 추인 가능합니다.<br>③ 계약이 해제된 후에도 착오가 있다면 취소할 수 있습니다.<br>⑤ 취소권 행사 기간(3년, 10년)은 제척기간입니다.</div>",
  "6-22": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>대리인의 성년후견 개시는 소멸사유이지만, 본인의 성년후견 개시는 대리권 소멸사유가 아닙니다(본인은 사망과 파산만 해당).</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>①②④⑤ 모두 대리권의 공통 또는 임의대리 특유의 소멸사유입니다.</div>",
  "6-23": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>지급명령 신청은 재판상 청구의 일종으로 소멸시효 중단사유에 해당합니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>②③④⑤ 모두 소멸시효 중단에 관한 옳은 설명입니다.</div>",
  "6-24": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>천재 기타 사변으로 중단할 수 없는 경우, 그 사유가 종료한 때로부터 '6개월' 내에는 시효가 완성되지 않습니다(시효의 정지).</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>①③④⑤ 모두 소멸시효에 관한 옳은 설명입니다.</div>",
  "6-25": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>불공정한 법률행위(제104조)는 무효행위의 추인은 안 되지만, 무효행위의 '전환' 규정은 적용될 수 있다는 것이 판례의 입장입니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>①②③⑤ 모두 법률행위 무효에 관한 옳은 설명입니다.</div>",

  "7-1": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>민법 제1조의 '법률'은 국회가 제정하는 형식적 의미의 법률뿐만 아니라, 명령, 규칙, 조례, 국제조약 등 성문의 법령 전체를 의미하는 실질적 의미의 법률을 뜻합니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 관습법은 성문법이 없는 경우에만 적용되는 보충적 효력을 갖습니다.<br>② 헌법에 의해 체결된 조약 중 민사에 관한 것은 성문법령으로서 법원이 됩니다.<br>③ 관습법은 법령과 같은 효력을 가지므로 법원이 직권으로 확정해야 합니다.<br>⑤ 관습법은 헌법을 최상위 규범으로 하는 전체 법질서에 반하지 않아야 합니다.</div>",
  "7-3": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>민법 제11조에 따른 성년후견종료 심판 청구권자는 본인, 배우자, 4촌 이내의 친족, 성년후견인, 성년후견감독인, 검사, 지방자치단체의 장입니다. 지방의회 의장은 포함되지 않습니다.</div>",
  "7-4": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>제한능력자가 속임수로써 법정대리인의 동의가 있는 것으로 믿게 한 경우에는 그 행위를 취소할 수 없습니다(민법 제17조).</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 취소권의 발생 원인(제한능력)은 취소하려는 측에서, 동의가 있었다는 사실은 유효를 주장하는 측에서 증명해야 합니다.<br>② 상대방이 제한능력자임을 알았다면 '철회권'을 행사할 수 없습니다(거절권만 가능).<br>③ 성년자가 된 본인이 확답을 발송하지 않으면 '추인'한 것으로 봅니다.<br>④ 제한능력 상태인 본인에게는 확답을 촉구하더라도 효력이 없습니다.</div>",
  "7-5": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>법인의 불법행위가 성립하더라도 대표자 개인의 손해배상 책임은 면제되지 않으며, 법인과 대표자는 부진정연대책임을 집니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 제35조의 대표자는 이사, 임시이사, 직무대행자 등을 의미하며 대표권 없는 이사는 포함되지 않습니다.<br>③ 법인이 배상한 경우 이사 개인에게 과실이 있다면 구상권을 행사할 수 있습니다.<br>④ 피해자가 '중과실'로 알지 못한 경우에만 법인의 책임이 부정됩니다(경과실은 책임 성립).<br>⑤ 법령 위반이라도 외관상·객관적으로 직무 관련성이 인정되면 직무에 관한 행위로 봅니다.</div>",
  "7-6": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>ㄴ. 저당권 설정은 재산의 처분이 아니므로 정관변경이 필요 없습니다.<br>ㄷ. 사단법인 정관변경은 총사원 2/3 이상의 동의가 원칙입니다(민법 제42조).</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>ㄱ. 정관변경은 주무관청의 허가를 얻어야 효력이 생기며, 등기는 대항요건일 뿐입니다.</div>",
  "7-7": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>법인과 이사의 관계는 민법상 위임 관계이므로, 정관에 해임 사유가 있더라도 중대한 사유가 있다면 언제든지 해임할 수 있다는 것이 판례입니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 민법에는 이사의 임기 제한 규정이 없어 정관으로 정합니다.<br>② 제75조 제1항의 일반 원칙입니다.<br>③ 이사는 '포괄적' 대리는 불가하나 '특정한 행위'에 대해서는 대리인을 선임할 수 있습니다.<br>④ 임시이사는 이사가 없거나 결원이 생겨 손해가 생길 염려가 있는 때 선임합니다.</div>",
  "7-8": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>청산종결등기가 경료되었더라도 청산사무가 완료되지 않았다면 법인은 그 범위 내에서 존속하며 소멸하지 않습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 제77조 제2항에 따른 임의해산 사유입니다.<br>② 법인의 해산·청산은 법원이 감독하고, 업무는 주무관청이 감독합니다.<br>④ 채무 초과 시 이사는 지체 없이 파산신청을 해야 합니다.<br>⑤ 청산인은 청산 범위 내에서 대표권을 가집니다.</div>",
  "7-9": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>종물은 주물 자체의 효용을 돕기 위한 것이어야 하므로, 소유자의 개인적 사용에만 공여되는 물건은 종물이 아닙니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 종물은 독립한 물건이어야 하므로 구성부분은 종물이 될 수 없습니다.<br>② 천연과실은 분리 시 수취권자에게 귀속되고, 법정과실이 존속기간 비율로 취득합니다.<br>③ 제100조 제2항(종물의 처분수반성)은 임의규정으로 반대 약정이 가능합니다.<br>⑤ 건물 개수는 공부상 기재뿐 아니라 사회통념상 건물로서의 독립성 등을 종합하여 판단합니다.</div>",
  "7-10": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>다수의 보험계약을 통해 보험금을 부정취득할 목적으로 체결된 보험계약은 사회질서에 반하여 무효라는 것이 판례입니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 민법 제103조의 기본 원칙입니다.<br>② 사회질서 위반 여부는 계약 체결 당시를 기준으로 합니다.<br>③ 강박은 의사표시의 하자 문제(취소 사유)일 뿐, 그 자체로 반사회질서 행위는 아닙니다.<br>⑤ 조세 회피 목적의 다운계약서 작성은 그 자체로 반사회질서 행위로 보지는 않습니다.</div>",
  "7-11": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>대리에 의한 법률행위 시 궁박은 본인 기준, 경솔과 무경험은 대리인 기준으로 판단합니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 증여와 같은 무상행위(기부)에는 불공정한 법률행위 규정이 적용되지 않습니다.<br>② 궁박·경솔·무경험 여부는 현저한 불균형을 판단하는 주관적 요건으로서 필수 고려대상입니다.<br>④ 상대방에게 폭리행위의 악의(이용 의사)가 반드시 있어야 성립합니다.<br>⑤ 불공정성은 추정되지 않으므로 무효를 주장하는 자가 모두 증명해야 합니다.</div>",
  "7-12": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>표의자에게 중대한 과실이 있더라도 상대방이 표의자의 착오를 알고 이용한 경우에는 표의자가 취소할 수 있습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 단순한 기대나 동기의 착오는 법률행위 내용의 착오가 아닙니다.<br>② 착오로 인해 경제적 불이익이 없다면 중요부분의 착오가 아닙니다.<br>③ 착오 취소는 적법한 권리행사이므로 상대방에 대한 불법행위가 성립하지 않습니다.<br>④ 제109조는 임의규정으로 취소권 배제 특약이 가능합니다.</div>",
  "7-13": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>ㄱ. 고지의무가 있는 자가 침묵하는 부작위는 기망행위가 됩니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>ㄴ. 계약을 취소하지 않고도 제3자의 사기에 의한 손해배상을 청구할 수 있습니다.<br>ㄷ. 정당한 권리 행사로서의 고소·고발도 부정한 이익을 목적으로 하면 위법한 강박이 될 수 있습니다.</div>",
  "7-14": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>의사표시자가 통지를 발송한 후 성년후견개시 심판을 받아도 그 의사표시의 효력에는 아무런 영향이 없습니다(민법 제111조 제2항).</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 도달주의 원칙입니다.<br>③ 등기우편이나 내용증명은 반송되지 않는 한 도달로 추정합니다.<br>④ 도달 전에는 효력이 없으므로 자유롭게 철회할 수 있습니다.<br>⑤ 도달이란 상대방이 알 수 있는 상태(요지 가능한 상태)를 의미하며, 실제 내용을 읽을 것까지 요하지 않습니다.</div>",
  "7-15": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>현명(본인을 위한 것임을 표시)은 명시적뿐만 아니라 주위 사정에 따른 묵시적 표시로도 충분합니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 제117조에 따라 대리인은 행위능력자일 필요가 없습니다.<br>② 유언 등 가족법상 행위는 본인의 절대적 의사가 중요하므로 대리가 허용되지 않습니다.<br>④ 임의대리는 원인 관계가 끝나기 전이라도 수권행위를 철회하여 종료할 수 있습니다.<br>⑤ 각자 대리가 원칙입니다.</div>",
  "7-16": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>복대리권은 대리권의 존재와 범위를 전제로 하므로 대리권의 범위를 넘을 수 없습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 복대리인은 '본인'의 대리인입니다.<br>② 법정대리인은 언제든지 자기 책임으로 복대리인을 선임할 수 있습니다.<br>④ 부득이한 사유로 선임한 경우에도 선임·감독에 관한 책임은 집니다(다만 책임이 경감됨).<br>⑤ 대리권이 소멸하면 복대리권도 함께 소멸합니다.</div>",
  "7-17": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>제135조에 따른 무권대리인의 책임은 법정 무과실책임이므로, 무권대리인에게 귀책사유(과실)가 없어도 인정됩니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 본인은 추인권을 가집니다.<br>② 상대방은 본인에게 확답을 촉구할 수 있는 최고권을 가집니다.<br>③ 무권대리인이 본인을 상속한 경우 무효를 주장하는 것은 금반언 원칙상 허용되지 않습니다.<br>④ 제135조 책임은 무과실책임이므로 제3자의 기망이 있었어도 책임이 면제되지 않습니다.</div>",
  "7-18": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>유동적 무효 상태에서 당사자 쌍방이 허가신청 협력의무 거절 의사를 명백히 표시한 경우 계약은 확정적 무효가 됩니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 허가를 받기 전까지는 채권적 효력도 발생하지 않습니다.<br>② 계약이 유효함을 전제로 하는 손해배상청구(채무불이행)는 할 수 없습니다.<br>③ 허가를 받으면 계약 성립 시로 소급하여 유효가 됩니다.<br>⑤ 무효는 누구라도 주장할 수 있는 것이 원칙이므로, 귀책사유가 있는 자도 무효를 주장할 수 있습니다.</div>",
  "7-19": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>ㄱ. 의사무능력 무효와 ㄴ. 반사회질서 무효는 누구에게나 주장할 수 있는 절대적 무효입니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>ㄷ. 비진의표시 무효와 ㄹ. 통정허위표시 무효는 선의의 제3자에게 대항할 수 없는 상대적 무효입니다.</div>",
  "7-20": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>법정추인 사유인 '권리의 양도'는 취소권자가 양도한 경우를 말합니다. 상대방이 권리를 양도한 것은 추인 사유가 아닙니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 무효인 행위는 추인해도 무효이나, '새로운 법률행위'로 볼 수는 있습니다.<br>② 제137조*는 당사자 약정으로 달리 정할 수 있는 임의규정입니다.<br>  * 제137조(법률행위의 일부무효) 법률행위의 일부분이 무효인 때에는 그 전부를 무효로 한다. 그러나 그 무효부분이 없더라도 법률행위를 하였을 것이라고 인정될 때에는 나머지 부분은 무효가 되지 아니한다.<br>④ 가분적이고 당사자의 가정적 의사가 인정되면 일부 취소가 가능합니다.<br>⑤ 일체성이 인정되면 일부만 떼어 취소할 수 없는 것이 원칙입니다.</div>",
  "7-21": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>부첩관계의 종료를 해제조건(관계를 끝내면 증여를 반환)으로 하는 증여는 조건 자체가 반사회적이어서 증여계약 전체가 무효입니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 기한부 권리도 일반 규정에 의해 처분·상속·보존·담보가 가능합니다.<br>② 조건부 권리에 대한 침해금지(제148조) 규정입니다.<br>③ 해제조건 성취는 비소급이 원칙이나 약정으로 소급시킬 수 있습니다.<br>④ 시기 있는 법률행위는 기한 도래 시부터 효력이 발생합니다.</div>",
  "7-22": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>민법상 연령 계산은 출생일을 산입하므로, 2000년 5월 25일에 태어난 자는 2019년 5월 25일 0시(생일 당일 시작 시점)에 만 19세가 되어 성년에 달합니다.</div>",
  "7-23": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>채권은 성질상 모두 소멸시효의 대상이 되므로 해제조건부 채권이나 불확정기한부 채권도 시효에 걸립니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>ㄷ. 소유권은 소멸시효에 걸리지 않습니다.<br>ㄹ. 인격권은 소멸시효의 대상이 아닙니다.</div>",
  "7-24": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>변론주의 원칙상 소멸시효의 기산점은 당사자가 주장하는 날을 기준으로 판단해야 합니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 판결로 확정된 채권은 '변제기가 도래한 때'부터 10년의 시효가 진행됩니다.<br>③ '권리를 행사할 수 있는 때'란 법률상의 장애가 없는 것을 의미하며, 사실상의 장애(병환 등)는 포함되지 않습니다.<br>④ 시효기간의 도과 여부는 법원이 직권으로 조사·판단합니다.<br>⑤ 반대채권은 그 자체의 성질에 따라 시효기간이 결정될 뿐, 상대방 채권의 기간을 따르지 않습니다.</div>",
  "7-25": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>민법 제56조(사원권의 양도·상속 금지)는 사단법인의 자율성을 존중하기 위한 임의규정이므로 정관으로 양도·상속을 허용할 수 있다는 것이 판례입니다.</div>",

  "8-1": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>ㄱ, ㄴ, ㄷ 모두 옳습니다. 관습법은 사회의 관행이 법적 확신을 얻어 성립하며(ㄱ), 성립 당시에는 유효했더라도 변화된 전체 법질서에 반하게 되면 효력이 부정됩니다(ㄴ). 또한 사실인 관습은 법령이 아닌 관행으로서 당사자의 의사를 보충하는 기능을 합니다(ㄷ).</div>",
  "8-2": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>항소권과 같은 소송법상의 권리 행사에도 신의성실의 원칙(실효의 원칙 등)이 적용될 수 있다는 것이 판례의 입장입니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>①, ②, ③, ④는 모두 신의칙의 적용 범위와 부수적 보호의무에 관한 옳은 설명입니다. 특히 숙박업자나 사용자의 보호의무는 신의칙상 인정되는 대표적인 의무입니다.</div>",
  "8-3": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>ㄴ만 옳습니다. 태아가 살아서 출생하면 직계존속(부모)의 부상에 대해 자기의 권리로서 위자료를 청구할 수 있습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>ㄱ: 태아는 '살아서 출생'해야 손해배상청구권을 가집니다. 출생 전 사망하면 청구권이 인정되지 않습니다.<br>ㄷ: 태아는 상속 순위에 관하여 이미 출생한 것으로 보므로, 아버지가 사망한 후 살아서 출생하면 당연히 상속권을 가집니다.</div>",
  "8-4": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>가정법원이 성년후견개시의 심판을 할 때에는 반드시 '본인의 의사'를 고려하여야 합니다(민법 제9조 제2항).</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 동의는 법률행위 전 취소 가능합니다.<br>②, ③ 미성년자의 단독 임금청구 및 대리행위는 유효합니다.<br>④ 제한능력자가 속임수를 써서 동의가 있는 것으로 믿게 한 경우 취소권이 배제됩니다.</div>",
  "8-5": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>비법인사단(종중, 교회 등) 사원의 지위는 규약이나 관행에 의해 양도 또는 상속될 수 있다는 것이 판례의 태도입니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 임시이사 규정 유추적용 가능합니다.<br>② 비법인사단의 소유형태는 총유입니다.<br>③ 단순 보증행위는 관리·처분행위가 아니라는 것이 판례입니다.<br>④ 비법인사단의 대표자가 직무에 관하여 타인에게 손해를 가한 경우, 민법 제35조제1항의 유추적용에 의해 비법인사단은 그 손해를 배상할 책임이 있다.</div>",
  "8-6": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>대표자의 행위가 직무에 관한 행위가 아님을 피해자가 알았거나(악의), 중대한 과실로 알지 못한 경우에는 법인의 불법행위책임이 성립하지 않습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 대표권 없는 이사는 제35조의 대표기관이 아닙니다.<br>② 대표기관 개인의 책임도 병존합니다.<br>③ 법령 위반 행위라도 외형상 직무 범위 내라면 직무행위에 해당할 수 있습니다.<br>⑤ 과실상계 법리는 당연히 적용됩니다.</div>",
  "8-7": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>이사의 임면에 관한 사항은 정관의 '필요적(필수적)' 기재사항입니다(민법 제40조).</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 포괄적 위임은 금지됩니다.<br>② 사원총회 결의에 의한 정관 해석은 법원을 구속하지 않습니다.<br>④ 특별이해관계인은 의결권이 없습니다.<br>⑤ 청산 규정은 강행규정입니다.</div>",
  "8-8": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>건물의 개수는 공부상의 등록(주관적 의사 포함) 및 건물 자체의 상태 등 객관적 사정을 종합하여 결정합니다. 주관적 사정이 전혀 고려되지 않는다는 설명은 틀렸습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>② 주물의 효용과 직접 관계없는 것은 종물이 아닙니다.<br>③ 주물과 종물의 분리 처분 약정은 유효합니다.<br>④ 입장료는 사용료일 뿐 법정과실이 아닙니다.</div>",
  "8-9": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>수사기관에서 허위진술을 하는 대가로 금원을 지급하기로 한 약정은 그 대가의 적정 여부와 관계없이 사회질서에 반하여 무효입니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 연수 후 의무재직 약정은 원칙적 유효입니다.<br>② 반사회적 무효는 추인해도 유효로 되지 않습니다.<br>③ 동기가 표시된 경우 반사회적 법률행위가 될 수 있습니다.</div>",
  "8-10": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>개업공인중개사가 중개의뢰인과 직접 거래하는 행위를 금지하는 「공인중개사법」 규정은 효력규정이 아닌 단속규정에 해당합니다. 따라서 이를 위반하여 이루어진 거래 행위의 사법상 효력은 유효하다는 것이 판례의 확고한 입장입니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 강행법규를 위반한 자가 스스로 그 무효를 주장하는 것은 특별한 사정이 없는 한 신의칙에 반하지 않습니다(무효 주장은 언제나 가능).<br>② 형사사건의 성공보수약정은 선량한 풍속 기타 사회질서에 위배되는 것으로서 반사회적 법률행위(제103조 위반)로 보아 무효입니다.<br>③ 부동산 중간생략등기 합의를 금지하는 규정은 단속규정이므로, 그 합의 자체는 사법상 유효합니다.<br>⑤ 강행법규 위반으로 무효인 법률행위에는 표현대리 법리가 적용될 여지가 없습니다(표현대리를 인정하면 강행법규를 잠탈하는 결과가 되기 때문).</div>",
  "8-11": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>표의자가 당시 상황에서 최선이라고 판단하여 의사표시를 했다면, 설령 마음속에서 진정으로 바라는 바가 아니었더라도 이는 비진의표시는 아닙니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① '진의'는 특정한 의사표시를 하고자 하는 생각을 뜻하며 진정 바라는 사항이 아닙니다.<br>④ 강박에 의한 증여는 비진의표시가 아닙니다.<br>⑤ 민법 제107조(비진의표시)는 개인과 개인 사이의 거래(사법상 행위)에 적용되므로 공무원의 사직의 의사표시와 같은 공법행위에는 비진의표시에 관한 민법의 규정이 적용되지 않습니다.</div>",
  "8-12": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>채권양도가 허위표시인 경우, 원래부터 채무를 지고 있던 '채무자'는 허위표시를 기초로 새로이 법률상 이해관계를 맺은 자가 아닙니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 양수인으로부터 양수한 자, ③ 경락인, ④ 파산관재인, ⑤ 가등기권자는 모두 제3자에 해당합니다.</div>",
  "8-13": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>동기의 착오를 이유로 취소하기 위해서는 그 동기가 상대방에게 표시되어 의사표시의 내용이 되면 충분하고, 당사자 사이에 합의까지 이루어질 필요는 없습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>② 중요부분 착오 요건입니다.<br>③ 중과실의 정의입니다.<br>④ 매매계약이 적법하게 해제된 후에도 착오를 이유로 그 매매계약을 취소할 수 있다.</div>",
  "8-14": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>매매계약 체결의 대리권을 수여받은 대리인은 특별한 사정이 없는 한 중도금이나 잔금을 수령할 권한도 가집니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>②, ③, ④, ⑤ 기한 연기, 대출, 계약 해제, 목적물 처분 등은 별도의 특별수권이 있어야 가능합니다.</div>",
  "8-15": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>표현대리가 성립하여 본인이 책임을 지는 경우, 상대방에게 과실이 있더라도 과실상계의 법리를 유추적용하여 본인의 책임을 감경할 수 없습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 직함 사용 승낙은 대리권 수여 표시로 볼 수 있습니다.<br>② 복대리인에 의한 권한 초과 표현대리 가능합니다.<br>⑤ 제126조는 법정대리에도 적용됩니다.</div>",
  "8-16": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>무권대리인이 대리권을 증명하지 못하고 본인의 추인을 얻지 못한 경우, 상대방의 선택에 따라 이행책임 또는 손해배상책임을 집니다(제135조).</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 악의라도 최고권은 인정됩니다.<br>② 추인은 무권대리인에게도 할 수 있습니다.<br>③ 철회권은 선의의 상대방만 가집니다.<br>⑤ 상속 시 신의칙상 추인 거절은 불가합니다.</div>",
  "8-17": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>무효인 법률행위는 법률효과 자체가 발생하지 않으므로, 채무불이행으로 인한 손해배상을 청구할 수 없습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 일부무효의 원칙(전부무효)입니다.<br>③ 불공정행위는 추인은 안 되지만 전환은 가능합니다. 즉, 무효인 계약이라도 당사자가 원했을 법한 '적정한 내용(대금 등)'으로 바꾸어 유효하게 부활시킬 수 있습니다(판례).<br>④ 법률행위가 불성립하는 경우 무효행위의 추인을 통해 유효로 전환할 수 없다.</div>",
  "8-18": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>취소권자에는 제한능력자 본인이 포함됩니다. 따라서 미성년자는 자신이 한 법률행위를 법정대리인의 동의 없이 단독으로 취소할 수 있습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 제한능력자의 현존이익 반환 특칙입니다.<br>② 제척기간(3년/10년) 설명입니다.<br>④ 취소의 소급효입니다.</div>",
  "8-19": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>취소할 수 있는 법률행위의 추인권자는 취소권자(본인, 대리인, 승계인 등)입니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 무효행위 추인은 소급효가 없습니다(그때부터 유효).<br>② 반사회적·불공정행위는 추인해도 유효로 되지 않습니다.<br>③ 무권리자가 타인의 권리를 처분하는 행위는 권리자가 이를 알고 추인하여도 그 처분의 효력이 발생하지 않는다.</div>",
  "8-20": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>시기(始期) 있는 법률행위는 기한이 도래한 때로부터 그 효력이 생깁니다(제152조 제1항).</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 기한의 이익은 채무자의 이익을 위한 것으로 추정합니다.<br>②, ③ 정지조건과 해제조건의 정의가 바뀌었습니다.<br>④ 불법조건이 붙은 법률행위는 원칙적으로 불법조건을 제외한 나머지는 유효하다.</div>",
  "8-21": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>ㄱ, ㄷ이 옳습니다. ㄱ: 1월 31일로부터 1개월은 2월 말일입니다. ㄷ: 말일이 공휴일이면 그 익일로 만료합니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>ㄴ: 초일불산입 원칙에 따라 3월 15일부터 기산하여 4월 15일 24시에 만료합니다.</div>",
  "8-22": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>소멸시효가 중단되면 중단까지 경과한 시효기간은 산입하지 않고, 중단사유가 종료한 때로부터 새로이 시효가 진행됩니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>② 시효 완성 시 소급하여 소멸합니다.<br>③ 시효이익 포기는 완성 후 알아야 가능합니다.<br>⑤ 제척기간은 그 성질상 기간의 중단이 있을 수 없다.</div>",
  "8-23": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>ㄴ만 옳습니다. 음식료 채권의 소멸시효는 1년입니다(제164조).</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>ㄱ: 소유권은 소멸시효에 걸리지 않습니다.<br>ㄷ: 점유권은 점유의 상실로 소멸하는 권리로, 소멸시효 대상이 아닙니다.</div>",
  "8-24": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>불확정기한부 채권의 소멸시효는 '객관적으로 기한이 도래한 때'부터 진행합니다. 채권자가 안 때가 아닙니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 확정기한은 도래 시부터입니다.<br>③ 기한 없는 채권은 발생(성립) 시부터입니다.<br>④ 부작위를 목적으로 하는 채권의 소멸시효는 위반행위를 한 때부터 진행한다.</div>",
  "8-25": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>법률행위의 내용이 처분문서로 작성된 경우, 문언의 객관적 의미를 우선적으로 해석해야 하며 당사자의 내심적 의사에만 구속되어 해석해서는 안 됩니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 당사자 확정은 의사해석 문제입니다.<br>② 의사표시의 해석은 당사자가 그 표시행위에 부여한 객관적인 의미를 명백하게 확정하는 것이다.<br>⑤ 문언의 객관적인 의미가 명확하다면 문언대로 인정하여야 한다.</div>",

  "9-1": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>형성권은 권리자의 일방적인 의사표시만으로 법률관계의 발생·변경·소멸을 일으키는 권리입니다. 반면, 물권적 청구권은 상대방에게 일정한 행위(반환, 제거, 예방)를 청구하는 권리로서 청구권에 해당합니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 물권적 청구권은 형성권이 아닌 청구권입니다.<br>② 취소권은 법률행위를 소급하여 무효로 만드는 형성권입니다.<br>③ 추인권은 무효나 취소할 수 있는 행위를 유효로 확정 짓는 형성권입니다.<br>④ 동의권은 법정대리인 등의 의사표시로 법률효과를 완성하는 형성권입니다.<br>⑤ 계약해지권은 계속적 계약관계를 장래를 향해 소멸시키는 형성권입니다.</div>",
  "9-2": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>권리남용으로 인한 손해배상청구권은 일반적인 불법행위에 의한 손해배상청구권과 같으므로, 민법 제766조에 따라 3년 또는 10년의 소멸시효가 적용됩니다. 1년의 단기시효가 적용되는 것이 아닙니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 판례는 확정판결에 의한 강제집행이라 하더라도 정의 관념에 반하는 경우 권리남용이 될 수 있다고 봅니다.<br>② 동시이행항변권을 오로지 채무이행을 회피하기 위한 수단으로 쓰는 것은 신의칙상 권리남용에 해당할 수 있습니다.<br>③ 권리남용이 성립하려면 주관적으로 타인을 해할 목적과 객관적으로 권리 행사가 정당한 이익이 없는 경우여야 합니다.<br>⑤ 권리남용으로 건물 철거 청구가 부정되더라도, 그 토지를 점유·사용함에 따른 부당이득반환의무는 면제되지 않습니다.</div>",
  "9-3": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>민법 제6조에 따라 처분을 허락한 재산의 처분 허락을 취소하거나 제한하더라도 '선의의 제3자'에게는 대항하지 못합니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 미성년자가 단순히 이익만을 얻거나 책임을 면하는 행위는 독자적으로 가능합니다.<br>② 허락된 특정한 영업에 관해서는 성년자와 동일한 행위능력을 가집니다.<br>④ 상대방이 계약 당시에 제한능력자임을 알았다면 철회권을 행사할 수 없습니다.<br>⑤ 상대방의 거절의 의사표시는 제한능력자 본인에게도 할 수 있습니다.</div>",
  "9-4": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>부재자가 재산관리인을 정한 경우라도, 부재자의 생사가 분명하지 아니한 때에는 법원은 이해관계인의 청구에 의하여 재산관리인을 개임할 수 있습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 관리인의 권한이 소멸한 때에는 법원은 새로운 관리인을 선임하거나 필요한 처분을 명해야 합니다.<br>③ 법원이 선임한 재산관리인이 보존 등을 넘는 처분행위를 하려면 법원의 허가를 얻어야 합니다.<br>④ 법원이 선임한 관리인은 부재자의 재산목록을 작성할 의무가 있습니다.<br>⑤ 법원은 관리인에게 부재자의 재산으로 상당한 보수를 지급할 수 있습니다.</div>",
  "9-5": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>법인과 이사의 이익이 상반하는 사항에 대하여는 이사가 대표권을 갖지 못하며, 이 경우 법원은 '특별대리인'을 선임해야 합니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>ㄴ. 이사가 여러 명인 경우 사무집행은 정관에 특별한 규정이 없으면 이사의 과반수로 결정합니다.<br>ㄷ. 이사의 대표권에 관하여는 대리에 관한 규정을 준용합니다.<br>ㄹ. 이사는 정관 또는 총회의 결의로 금지하지 아니한 사항에 한하여 특정 행위를 대리하게 할 수 있습니다.</div>",
  "9-6": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>민법 제35조의 대표자에는 등기된 이사뿐만 아니라 실질적으로 법인을 운영하며 사실상 대표하여 사무를 집행하는 사람도 포함됩니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 법인이 불법행위 책임을 지더라도 대표자 개인의 손해배상 책임이 면제되지 않습니다.<br>③ 법인의 불법행위 책임은 선임·감독상 주의의무를 다했음을 입증해도 면책되지 않습니다.<br>④ 외형상 직무 범위 내의 행위라면 이사가 개인적 이익을 도모할 목적이었더라도 직무 관련성이 인정됩니다.<br>⑤ 청산절차 중의 청산인은 법인의 대표자로서 불법행위 책임의 대상이 됩니다.</div>",
  "9-7": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>재단법인의 정관에서 존립시기나 해산사유는 임의적 기재사항에 해당합니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 비영리재단법인을 설립하려면 주무관청의 허가를 받아야 합니다.<br>② 법인은 주된 사무소의 소재지에서 설립등기를 함으로써 성립합니다.<br>③ 법인은 정관으로 정한 목적의 범위 내에서 권리와 의무의 주체가 됩니다.<br>⑤ 설립자가 이사 임면 방법을 정하지 않고 사망한 때에는 법원이 이를 정합니다.</div>",
  "9-8": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>민법상 과실은 천연과실과 법정과실을 의미하며, 주식 배당금이나 특허권 사용료 등 '권리의 과실'은 직접 포함되지 않습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 전기 기타 관리할 수 있는 자연력은 동산으로 간주합니다.<br>② 유골은 제사주재자에게 귀속되는 특수 소유권의 대상입니다.<br>③ 금전은 점유가 있는 곳에 소유권이 인정되는 특수 동산입니다.<br>④ 주물을 시효취득하면 종물도 취득하는 것이 원칙이나 점유하지 않았다면 성립하지 않습니다.</div>",
  "9-9": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>'살인을 하지 않겠다'는 약정은 도덕적 의무를 조건으로 금전을 청구하는 것이므로 반사회적 법률행위로서 무효입니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 형사사건 성공보수약정은 반사회적 행위로 무효입니다.<br>② 배임행위에 적극 가담하여 체결한 이중매매 계약은 무효입니다.<br>④ 어떤 일이 있어도 이혼하지 않겠다는 약정은 무효입니다.<br>⑤ 수사기관에서 허위 진술을 대가로 금전을 지급하기로 한 약정은 무효입니다.</div>",
  "9-10": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>통정허위표시의 무효는 선의의 제3자에게 대항하지 못합니다. 제3자 丙이 선의라면 유효하게 소유권을 취득하며, 그로부터 다시 부동산을 매수한 丁은 설령 악의이더라도 소유권을 보호받습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>①② 甲·乙 사이의 매매는 허위표시로서 당사자 간에는 언제나 무효입니다. 계약이 무효이므로 乙은 대금지급 의무가 없고, 甲은 소유권에 기해 乙에게 부동산 반환을 구할 수 있습니다.<br>③ 甲은 선의의 丙에게 무효를 주장하여 등기 말소를 청구하거나 부동산 반환을 구할 수 없습니다.<br>④ 제3자 丙은 선의이기만 하면 족하고 무과실까지는 요하지 않습니다.</div>",  "9-11": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>재판 결과를 예측하여 화해 계약을 체결한 경우, 예측이 실제와 다르다는 점은 착오 취소의 사유가 되지 않습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 중요부분에 착오가 있는 때에는 취소할 수 있습니다.<br>③ 상대방이 착오를 알고 이용한 경우에는 중과실이 있어도 취소할 수 있습니다.<br>④ 중과실 증명책임은 취소를 저지하려는 상대방에게 있습니다.<br>⑤ 착오 취소는 적법한 권리 행사이므로 불법행위 손해배상책임이 없습니다.</div>",
  "9-12": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>제3자의 사기로 계약을 체결한 경우, 그 계약을 취소하지 않고도 제3자에 대하여 불법행위 손해배상을 청구할 수 있습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 사기에 의한 취소는 기망, 착오, 의사표시 간 인과관계가 필요합니다.<br>② 제3자 사기의 경우 상대방이 알았거나 알 수 있었을 때만 취소 가능합니다.<br>③ 대리인의 사기는 본인의 사기와 동일시되어 본인의 인지 여부와 관계없이 취소 가능합니다.<br>④ 단순 피용자는 제3자에 해당합니다.</div>",
  "9-13": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>대리권 남용 시 상대방이 그 사정을 알았거나 알 수 있었다면 비진의표시 규정을 유추적용하여 본인에게 효력이 없습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>② 자신의 이름으로 서명했더라도 대리의사가 객관적으로 인정되면 유효합니다.<br>③ 본인의 지시에 따른 경우 본인은 대리인의 부지를 주장할 수 없습니다.<br>④ 본인이 직접 계약을 체결했다는 이유만으로 대리인의 정당한 대리행위가 무효가 되지는 않습니다. 이 경우 부동산 이중매매와 같은 법리에 따라 먼저 등기를 갖춘 자가 소유권을 취득하며, 본인은 이행하지 못한 계약 상대방에게 손해배상 책임을 집니다.<br>⑤ 대리인은 행위능력자임을 요하지 않습니다.</div>",
  "9-14": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>권한을 정하지 않은 대리인은 보존행위와 성질이 변하지 않는 범위 내에서만 이용·개량행위를 할 수 있으며, '모든' 개량행위를 할 수 있는 것은 아닙니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>② 수권대리권은 수령대리권을 포함하는 것이 원칙입니다.<br>③ 대리권 수권은 묵시적으로도 가능합니다.<br>④ 본인은 언제든지 수권행위를 철회하여 대리권을 소멸시킬 수 있습니다.<br>⑤ 대리인의 성년후견 개시는 대리권 소멸 사유입니다.</div>",
  "9-15": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>복대리인은 대리인이 자신의 이름으로 선임한 '본인의 대리인'이지 법정대리인이 아닙니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 법정대리인은 언제든지 자기 책임하에 복대리인을 선임할 수 있습니다.<br>③ 부득이하게 선임한 경우 선임·감독상의 과실에 대해서만 책임을 집니다.<br>④ 대리권이 소멸하면 복대리권도 소멸합니다.<br>⑤ 복대리인도 본인에게 수령물을 인도할 의무가 있습니다.</div>",
  "9-16": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>ㄷ. 특별한 정함이 없으면 각자대리가 원칙입니다. ㄹ. 단순한 채무의 이행은 본인의 허락 없이도 쌍방대리가 가능합니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>ㄱ. 무권대리 추인은 원칙적으로 계약 시부터 소급효가 인정됩니다.<br>ㄴ. 최고에 대해 확답을 발하지 않으면 추인을 거절한 것으로 봅니다.</div>",
  "9-17": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>표현대리에서 보호받는 제3자는 대리행위의 '직접 상대방'만을 의미하며 전득자는 포함되지 않습니다.<br>* 전득자: 중간 거래를 거쳐 물건이나 권리를 최종적으로 산 사람</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 기본대리권과 표현대리 행위가 동종일 필요는 없습니다.<br>② 본인 성명 도용 시에는 원칙적으로 표현대리가 성립하지 않습니다.<br>④ 정당한 이유는 대리행위 당시를 기준으로 판단합니다.<br>⑤ 복대리인의 권한도 기본대리권이 될 수 있습니다.</div>",
  "9-18": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>무권대리행위의 일부 추인은 상대방의 동의를 얻지 못하는 한 무효입니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 형사고소를 하지 않았다는 사정만으로는 추인으로 보지 않습니다.<br>② 추인 거절로 무효가 확정된 후에는 철회할 수 없습니다.<br>④ 추인은 무권대리인에게도 할 수 있습니다.<br>⑤ 무권대리인의 책임은 무과실책임입니다.</div>",
  "9-19": "<div class='exp-section'><strong>✓ 정답 해설 (⑤)</strong><br>대리인으로서 계약을 맺은 자가 제한능력자인 경우에는 무권대리인의 책임을 묻지 못합니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 유권대리 주장 속에 표현대리 주장이 포함된 것은 아닙니다.<br>② 표현대리 시 과실상계를 통한 책임 감경은 인정되지 않습니다.<br>③ 강행법규 위반 무효 시 표현대리는 적용되지 않습니다.<br>④ 상대방이 악의라면 철회권이 없습니다.</div>",
  "9-20": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>불공정한 법률행위는 반사회적 행위로서 추인에 의하여 유효가 될 수 없습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 일부 무효는 전부 무효가 원칙입니다.<br>② 의사무능력자는 이익이 현존하는 한도에서 상환 책임을 집니다.<br>③ 무효행위 추인은 소급효가 없는 것이 원칙입니다.<br>⑤ 반사회적 행위의 무효는 절대적 무효입니다.</div>",
  "9-21": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>일단 취소하면 무효가 되므로 취소할 수 있는 행위의 추인은 불가하나 무효행위의 추인은 가능합니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 제한능력자도 단독으로 취소할 수 있습니다.<br>③ 근로계약 취소 등은 소급효가 제한될 수 있습니다.<br>④ 이의를 보류한 경우에는 법정추인이 되지 않습니다.<br>⑤ 해제 후에도 착오 취소가 가능합니다.</div>",
  "9-22": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>민법 제157조에 따라 기간의 초일은 산입하지 않는 것이 원칙이나, 기간이 오전 0시부터 시작하는 경우에는 초일을 산입합니다. 지문처럼 '오는 7월 1일부터'라고 정한 경우 0시부터 기산되므로 초일인 7월 1일을 산입해야 합니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>② 시, 분, 초 단위로 정한 기간은 즉시로부터 기산합니다.<br>③ 월 단위 기간에서 최종월에 해당일이 없으면 그 월의 말일로 만료합니다.<br>④ 기간 말일이 공휴일이면 그 다음 날(익일)로 만료합니다.<br>⑤ 연령 계산 시에는 출생일을 산입하며, 정년 60세는 만 60세에 도달하는 날을 의미합니다.</div>",
  "9-23": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>소멸시효는 연장할 수 없으나 단축 또는 경감하는 것은 허용됩니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 소멸시효는 당사자가 주장해야 법원이 판단합니다.<br>② 보증인이나 물상보증인도 시효를 원용할 수 있습니다.<br>③ 시효이익 포기 후에는 새로 시효가 진행됩니다.<br>⑤ 시효완성 효력은 기산일에 소급합니다.</div>",
  "9-24": "<div class='exp-section'><strong>✓ 정답 해설 (①)</strong><br>채권 소멸시효는 10년이며, 채권 및 소유권 외의 재산권은 20년입니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>② 점유권은 소멸시효의 대상이 아닙니다.<br>③ 소멸시효는 권리를 행사할 수 있는 때부터 진행합니다.<br>④ 정지조건부 권리는 조건 성취 시부터 진행합니다.<br>⑤ 부작위 채권은 위반행위 시부터 진행합니다.</div>",
  "9-25": "<div class='exp-section'><strong>✓ 정답 해설 (③)</strong><br>시효중단인 승인은 시효진행 개시 후 하는 것이며 미리 하는 승인은 효력이 없습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 피고로서 응소하여 승소한 경우 중단 효력이 있습니다.<br>② 일부 변제는 시효를 중단시킵니다.<br>④ 화해 소환 시 1개월 내 소 제기를 안 하면 효력이 없습니다.<br>⑤ 시효 중단은 당사자 및 승계인 간에만 효력이 있습니다.</div>",

  "10-1": "<div class='exp-section'><strong>✓ 정답 해설 (②,④ 중복정답)</strong><br>② 관습법도 헌법에 위반될 경우 헌법재판소의 위헌법률심판 대상이 될 수 있다는 것이 통설 및 판례의 입장입니다.<br>④ 사실인 관습은 '법'이 아닙니다. 민법 제1조에서 말하는 법원(성문법, 관습법, 조리)에 포함되지 않습니다. 법이 아니니 법원(법의 원천)이 될 수 없습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 조약도 민사에 관한 것이면 법원이 됩니다.<br>③ 관습법은 법령과 같은 효력이므로 직권 확정 대상입니다.<br>⑤ 종중 구성원의 평등권에 관한 최신 판례입니다.</div>",
  "10-2": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>제한능력자 보호 제도는 강행규정이므로, 미성년자가 스스로 계약을 취소하는 것은 신의칙 위반이 아닙니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 신의칙은 강행규정이므로 직권 판단 가능합니다.<br>③ 금반언 원칙에 따라 상속 후 추인 거절은 허용 안 됩니다.<br>④ 보호의무는 신의칙상 인정되는 부수적 의무입니다.<br>⑤ 계약 유효 시 급부 감축은 원칙적으로 불가능합니다.</div>",
  "10-3": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>재산관리인이 허가 없이 한 행위라도 나중에 법원이 허가(추인)하면 소급하여 유효하게 됩니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 위임받은 관리인은 본인의 위임 범위 내에서 자유롭게 처분 가능합니다.<br>③ 담보 제공은 관리인의 성실한 이행을 담보하기 위함입니다.<br>④ 실종기간 만료 시 사망한 것으로 간주합니다.<br>⑤ 2순위 상속인은 상속권 기대가 없으므로 이해관계인이 아닙니다.</div>",

  "10-10": "<div class='exp-section'><strong>✓ 정답 해설 (②)</strong><br>의사표시 발신 후 사망하거나 제한능력자가 되어도 그 효력에 영향을 미치지 않습니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 도달주의 원칙입니다.<br>③ 성년의제나 혼인 등으로 능력을 갖췄다면 수령능력이 있습니다.<br>④ 상대방을 모를 때의 구제책입니다.<br>⑤ 제한능력자에게는 도달로써 대항하지 못하는 것이 원칙입니다.</div>",
  "10-11": "<div class='exp-section'><strong>✓ 정답 해설 (④)</strong><br>권한이 정해지지 않은 대리인은 보존행위뿐만 아니라 성질이 변하지 않는 범위 내의 이용/개량행위도 가능합니다.</div><div class='exp-section'><strong>✗ 오답 해설</strong><br>① 대리인은 의사결정만 하면 되므로 행위능력이 필요 없습니다.<br>② 묵시적 수권의 인정입니다.<br>③ 수권행위는 본인의 단독행위이므로 철회가 자유롭습니다.<br>⑤ 복대리인은 대리인의 이름으로 선임하지만 본인의 대리인입니다.</div>",
