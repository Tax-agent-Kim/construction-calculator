<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>건설업 뉴스 | 김용래세무사사무소 기업진단센터</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1.5rem 0;
            margin-bottom: 2rem;
            position: relative;
        }
        
        .header .container {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .home-btn {
            position: absolute;
            left: 15px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        
        .home-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
            color: white;
        }
        
        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0;
        }
        
        .nav-tabs {
            border-bottom: 2px solid #dee2e6;
            margin-bottom: 2rem;
        }
        
        .nav-tabs .nav-link {
            color: #6c757d;
            font-weight: 600;
            border: none;
            padding: 0.75rem 1.5rem;
            margin-right: 0.5rem;
            border-radius: 8px 8px 0 0;
            transition: all 0.3s ease;
        }
        
        .nav-tabs .nav-link:hover {
            color: #495057;
            background-color: #e9ecef;
        }
        
        .nav-tabs .nav-link.active {
            color: #667eea;
            background-color: white;
            border-bottom: 3px solid #667eea;
        }
        
        .news-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }
        
        .news-card:hover {
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
            border-color: #667eea;
            transform: translateY(-2px);
        }
        
        .news-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 0.75rem;
            line-height: 1.5;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .news-title a {
            text-decoration: none;
            color: inherit;
        }
        
        .news-title a:hover {
            color: #667eea;
        }
        
        .news-meta {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: #6c757d;
            font-size: 0.9rem;
        }
        
        .news-source {
            font-weight: 600;
            color: #495057;
        }
        
        .news-time {
            color: #adb5bd;
        }
        
        .loading {
            text-align: center;
            padding: 3rem;
            color: #6c757d;
        }
        
        .spinner-border {
            width: 3rem;
            height: 3rem;
        }
        
        .badge-new {
            background-color: #dc3545;
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-left: 0.5rem;
        }
        
        @media (max-width: 768px) {
            .nav-tabs .nav-link {
                padding: 0.5rem 1rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="container">
            <a href="index.html" class="home-btn" title="홈으로">🏠</a>
            <h1>🏗️ 건설업 뉴스</h1>
        </div>
    </div>

    <div class="container">
        <ul class="nav nav-tabs" id="newsTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="all-tab" data-bs-toggle="tab" data-bs-target="#all" 
                        data-keyword="건설업" type="button" role="tab">전체</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="contract-tab" data-bs-toggle="tab" data-bs-target="#contract" 
                        data-keyword="공공수주" type="button" role="tab">#공공수주</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="overseas-tab" data-bs-toggle="tab" data-bs-target="#overseas" 
                        data-keyword="해외건설" type="button" role="tab">#해외건설</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="tech-tab" data-bs-toggle="tab" data-bs-target="#tech" 
                        data-keyword="건설IT" type="button" role="tab">#건설IT</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="estate-tab" data-bs-toggle="tab" data-bs-target="#estate" 
                        data-keyword="부동산" type="button" role="tab">#부동산</button>
            </li>
        </ul>

        <div class="tab-content" id="newsTabContent">
            <div class="tab-pane fade show active" id="all" role="tabpanel">
                <div id="newsContainer-all" class="news-container">
                    <div class="loading">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="mt-3">뉴스를 불러오는 중입니다...</p>
                    </div>
                </div>
            </div>
            <div class="tab-pane fade" id="contract" role="tabpanel">
                <div id="newsContainer-contract" class="news-container"></div>
            </div>
            <div class="tab-pane fade" id="overseas" role="tabpanel">
                <div id="newsContainer-overseas" class="news-container"></div>
            </div>
            <div class="tab-pane fade" id="tech" role="tabpanel">
                <div id="newsContainer-tech" class="news-container"></div>
            </div>
            <div class="tab-pane fade" id="estate" role="tabpanel">
                <div id="newsContainer-estate" class="news-container"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const API_ENDPOINT = '/api/naver-news';
        
        async function loadNews(keyword, containerId) {
            const container = document.getElementById(containerId);
            
            container.innerHTML = `
                <div class="loading">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-3">뉴스를 불러오는 중입니다...</p>
                </div>
            `;
            
            try {
                const response = await fetch(`${API_ENDPOINT}?keyword=${encodeURIComponent(keyword)}&display=10`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.message);
                }
                
                if (data.items && data.items.length > 0) {
                    displayNews(data.items, container);
                } else {
                    container.innerHTML = `<div class="alert alert-info">"${keyword}" 관련 뉴스가 없습니다.</div>`;
                }
                
            } catch (error) {
                console.error('뉴스 로딩 에러:', error);
                container.innerHTML = `
                    <div class="alert alert-warning">
                        <h5>⚠️ 뉴스를 불러올 수 없습니다</h5>
                        <p>${error.message}</p>
                        <a href="https://news.naver.com/main/search.naver?query=${keyword}" 
                           target="_blank" class="btn btn-primary btn-sm mt-2">
                            네이버에서 직접 보기 →
                        </a>
                    </div>
                `;
            }
        }
        
        function displayNews(newsItems, container) {
            const now = new Date();
            
            const newsHTML = newsItems.map(item => {
                const title = item.title.replace(/<[^>]*>/g, '');
                const pubDate = new Date(item.pubDate);
                const diffMinutes = Math.floor((now - pubDate) / 1000 / 60);
                
                // 날짜/시간 형식: MM.DD HH:MM
                const month = String(pubDate.getMonth() + 1).padStart(2, '0');
                const day = String(pubDate.getDate()).padStart(2, '0');
                const hours = String(pubDate.getHours()).padStart(2, '0');
                const minutes = String(pubDate.getMinutes()).padStart(2, '0');
                const dateTimeText = `${month}.${day} ${hours}:${minutes}`;
                
                const isNew = diffMinutes < 60;
                
                // 언론사명 추출 (더 많은 언론사 추가)
                let source = '언론사';
                try {
                    const url = new URL(item.originallink);
                    const hostname = url.hostname.replace('www.', '');
                    
                    const sourceMap = {
                        'chosun.com': '조선일보',
                        'donga.com': '동아일보',
                        'joongang.co.kr': '중앙일보',
                        'hani.co.kr': '한겨레',
                        'khan.co.kr': '경향신문',
                        'cnews.co.kr': '건설경제',
                        'cnb.co.kr': '건설이코노미',
                        'mk.co.kr': '매일경제',
                        'hankyung.com': '한국경제',
                        'yonhapnews.co.kr': '연합뉴스',
                        'sedaily.com': '서울경제',
                        'mt.co.kr': '머니투데이',
                        'ajunews.com': '아주경제',
                        'heraldcorp.com': '헤럴드경제',
                        'edaily.co.kr': '이데일리',
                        'fnnews.com': '파이낸셜뉴스',
                        'newspim.com': '뉴스핌',
                        'newsis.com': '뉴시스',
                        'news1.kr': '뉴스1',
                        'yna.co.kr': '연합뉴스',
                        'asiae.co.kr': '아시아경제',
                        'etnews.com': '전자신문',
                        'dt.co.kr': '디지털타임스'
                    };
                    
                    for (const [domain, name] of Object.entries(sourceMap)) {
                        if (hostname.includes(domain)) {
                            source = name;
                            break;
                        }
                    }
                    
                    // sourceMap에 없으면 도메인명 사용
                    if (source === '언론사') {
                        source = hostname.split('.')[0];
                    }
                } catch (e) {}
                
                return `
                    <div class="news-card">
                        <h3 class="news-title">
                            <a href="${item.originallink}" target="_blank" rel="noopener noreferrer">
                                ${title}
                                ${isNew ? '<span class="badge-new">NEW</span>' : ''}
                            </a>
                        </h3>
                        <div class="news-meta">
                            <span class="news-source">${source}</span>
                            <span>•</span>
                            <span class="news-time">${dateTimeText}</span>
                        </div>
                    </div>
                `;
            }).join('');
            
            container.innerHTML = newsHTML;
        }
        
        document.querySelectorAll('[data-bs-toggle="tab"]').forEach(tab => {
            tab.addEventListener('shown.bs.tab', function (event) {
                const keyword = event.target.getAttribute('data-keyword');
                const targetId = event.target.getAttribute('data-bs-target').substring(1);
                const containerId = `newsContainer-${targetId}`;
                
                const container = document.getElementById(containerId);
                if (!container.innerHTML.trim() || container.querySelector('.loading')) {
                    loadNews(keyword, containerId);
                }
            });
        });
        
        document.addEventListener('DOMContentLoaded', function() {
            loadNews('건설업', 'newsContainer-all');
        });
    </script>
</body>
</html>
