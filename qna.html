                    </div>
                    <div id="adminAuth" style="text-align: right; margin-top: 5px;">
                        <button id="loginBtn" onclick="adminLogin()" style="padding: 4px 8px; background: transparent; color: #999; border: 1px solid #ddd; border-radius: 3px; cursor: pointer; font-size: 11px; display: none;">
                            관리자
                        </button>

                                <span id="adminName"></span>
                            </div>
                            <button onclick="adminLogout()" style="padding: 3px 6px; background: transparent; color: #999; border: 1px solid #ddd; border-radius: 3px; cursor: pointer; font-size: 10px;">
                                로그아웃

            </div>

                </div>
                <div class="write-form-body">
                    <form id="writeForm">
                        <table class="form-table">
                            <tr>
                                <th>이름</th>
                                <td>
                                    <input type="text" class="form-input" id="authorInput" placeholder="이름 또는 닉네임" required>
                                </td>
                            </tr>
                            <tr>

        // 간단한 해시 함수
        async function simpleHash(text) {
            const encoder = new TextEncoder();
            const data = encoder.encode(text);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        });
        
        // 현재 질문 정보
        let currentQuestionId = null;

        // 목록 화면 표시

        // 상세 화면 표시
        async function showDetailView(id) {
            document.getElementById('listView').style.display = 'none';
            document.getElementById('detailView').style.display = 'block';
            
            currentQuestionId = id;
            
            try {
                const docRef = doc(db, 'questions', id);
                const docSnap = await getDoc(docRef);
                
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    currentQuestionData = data;
                    
                    // 조회수 증가
                    const currentViews = data.views || 0;

                    });
                    
                    document.getElementById('viewTitle').textContent = data.title;

                    document.getElementById('viewContent').textContent = data.content;

        // 질문 목록 불러오기
        let allQuestions = []; // 전체 질문 저장
        
        function loadQuestionsList() {
            const questionsList = document.getElementById('questionsList');
            const totalCount = document.getElementById('totalCount');
            const q = query(collection(db, 'questions'), orderBy('createdAt', 'desc'));
            
            onSnapshot(q, (snapshot) => {
                if (snapshot.empty) {
                    questionsList.innerHTML = `
                        <tr>
                            <td colspan="5" style="padding: 60px 20px; text-align: center;">
                                <div style="font-size: 48px; margin-bottom: 15px;">📝</div>
                                <p style="color: #999;">아직 등록된 게시글이 없습니다.<br>첫 번째 글을 작성해주세요!</p>
                            </td>
                        </tr>
                    `;
                    totalCount.textContent = '0';
                    return;
                }
                
                // 전체 질문 저장 (검색용)
                allQuestions = [];
                snapshot.forEach((doc) => {
                    allQuestions.push({ id: doc.id, data: doc.data() });
                });
                
                displayQuestions(allQuestions);
            });
        }
        
        // 질문 표시 함수
        function displayQuestions(questionsToDisplay) {
            const questionsList = document.getElementById('questionsList');
            const totalCount = document.getElementById('totalCount');
            
            const notices = [];
            const questions = [];
            
            questionsToDisplay.forEach(({ id, data }) => {
                if (data.isNotice) {
                    notices.push({ id: id, data: data });
                } else {
                    questions.push({ id: id, data: data });
                }
            });
            
            questionsList.innerHTML = '';
            
            const total = questionsToDisplay.length;
            totalCount.textContent = total;
            
            // 공지사항
                notices.forEach(({ id, data }) => {
                    const createdDate = data.createdAt ? new Date(data.createdAt.toDate()) : new Date();
                    const date = createdDate.toLocaleDateString('ko-KR').slice(5);
                    
                    // 오늘 날짜인지 확인
                    const today = new Date();
                    const isToday = createdDate.toDateString() === today.toDateString();
                    const timeString = isToday ? createdDate.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : date;
                    
                    const row = document.createElement('tr');
                    row.className = 'notice';
                    row.onclick = () => window.location.href = 'qna.html?id=' + id;
                    
                    // 댓글 개수 가져오기
                    const commentsRef = collection(db, 'questions', id, 'comments');
                    const commentsQuery = query(commentsRef);
                    
                    onSnapshot(commentsQuery, (commentsSnap) => {
                        const commentCount = commentsSnap.size;

                        row.innerHTML = `
                            <td><span class="notice-badge">공지</span></td>
                            <td class="title">
                                <span class="notice-badge mobile-only">공지</span>
                                <strong>${data.title}</strong>${commentBadge}
                                <div class="mobile-meta">
                                    <span>${data.author}</span>
                                    <span>${timeString}</span>
                                    <span>👁 ${data.views || 0}</span>
                                </div>
                            </td>
                            <td class="author">${data.author}</td>
                            <td class="date">${timeString}</td>
                            <td class="views">${data.views || 0}</td>
                        `;
                    });
                    
                    questionsList.appendChild(row);
                });
                
                // 일반 게시글
                questions.forEach(({ id, data }) => {
                    const createdDate = data.createdAt ? new Date(data.createdAt.toDate()) : new Date();
                    const date = createdDate.toLocaleDateString('ko-KR').slice(5);
                    
                    // 오늘 날짜인지 확인
                    const today = new Date();
                    const isToday = createdDate.toDateString() === today.toDateString();
                    const timeString = isToday ? createdDate.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : date;
                    
                    const row = document.createElement('tr');
                    row.onclick = () => window.location.href = 'qna.html?id=' + id;

                        const commentCount = commentsSnap.size;
                        const commentBadge = commentCount > 0 ? 
                            ` <span style="color: #007bff; font-size: 14px;">💬 ${commentCount}</span>` : '';
                        
                        row.innerHTML = `
                            <td>${data.postNumber || '?'}</td>
                            <td class="title">
                                ${data.title}${commentBadge}
                                <div class="mobile-meta">
                                    <span>${data.author}</span>
                                    <span>${timeString}</span>
                                    <span>👁 ${data.views || 0}</span>

                            </td>
                            <td class="author">${data.author}</td>
                            <td class="date">${timeString}</td>
                            <td class="views">${data.views || 0}</td>
                        `;
                    });
                    
                    questionsList.appendChild(row);
                });
            }
        
        // 검색 기능
        window.searchQuestions = function() {
            const searchInput = document.getElementById('searchInput');
            const searchKeyword = searchInput.value.trim().toLowerCase();
            const searchResult = document.getElementById('searchResult');
            
            if (!searchKeyword) {
                alert('검색어를 입력하세요.');
                return;
            }
            
            const filtered = allQuestions.filter(({ data }) => {
                const title = (data.title || '').toLowerCase();
                const content = (data.content || '').toLowerCase();
                return title.includes(searchKeyword) || content.includes(searchKeyword);
            });
            
            displayQuestions(filtered);
            searchResult.textContent = `"${searchKeyword}" 검색 결과: ${filtered.length}건`;
        };

            document.getElementById('searchResult').textContent = '';

        // 답변 불러오기
        function loadComments(questionId) {
            const commentsList = document.getElementById('commentsList');
            const commentCount = document.getElementById('commentCount');
            
            const q = query(
                collection(db, 'questions', questionId, 'comments'),
                orderBy('createdAt', 'asc')
            );
            
            onSnapshot(q, (snapshot) => {
                if (snapshot.empty) {
                    commentsList.innerHTML = '<div style="text-align: center; padding: 30px; color: #999;">아직 답변이 없습니다.</div>';
                    commentCount.textContent = '(0)';
                    return;
                }
                
                commentsList.innerHTML = '';
                commentCount.textContent = `(${snapshot.size})`;
                
                snapshot.forEach((doc) => {
                    const comment = doc.data();
                    const commentId = doc.id;
                    const date = comment.createdAt ? 
                        new Date(comment.createdAt.toDate()).toLocaleDateString('ko-KR') + ' ' +
                        new Date(comment.createdAt.toDate()).toLocaleTimeString('ko-KR', {hour: '2-digit', minute: '2-digit'}) : '방금';
                    
                    // 관리자 답변 확인
                    const isAdminComment = comment.isAdmin || false;
                    const authorDisplay = isAdminComment ? 
                        `<span style="background: #e3f2fd; padding: 2px 8px; border-radius: 4px; font-weight: bold; color: #1976d2;">👨‍💼 건설업 전문 김세무사</span>` : 
                        comment.author;
                    
                    const commentDiv = document.createElement('div');
                    commentDiv.className = 'comment-item';

                            <span class="comment-date">${date}</span>
                        </div>
                        <div class="comment-content">${comment.content}</div>

                            ${isAdmin ? 
                                `<button class="comment-btn" onclick="adminDeleteComment('${questionId}', '${commentId}')">삭제 (관리자)</button>` :
                                `<button class="comment-btn" onclick="editComment('${questionId}', '${commentId}', '${comment.passwordHash}')">수정</button>
                                <button class="comment-btn" onclick="deleteComment('${questionId}', '${commentId}', '${comment.passwordHash}')">삭제</button>`
                            }
                        </div>
                    `;
                    
                    commentsList.appendChild(commentDiv);
                });
            });
        }
        
        // 글쓰기 폼 토글
        window.toggleWriteForm = function() {
            const formContainer = document.getElementById('writeFormContainer');

                formContainer.style.display = 'none';
            }

        // 질문 등록
        const writeForm = document.getElementById('writeForm');
        const submitBtn = document.getElementById('submitBtn');
        
        writeForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const author = document.getElementById('authorInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const title = document.getElementById('titleInput').value.trim();
            const content = document.getElementById('contentInput').value.trim();
            
            if (!author || !password || !title || !content) {
                alert('모든 항목을 입력해주세요.');
                return;
            }
            
            if (password.length < 4) {
                alert('비밀번호는 4자리 이상 입력해주세요.');
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.textContent = '등록 중...';
            
            try {
                const passwordHash = await simpleHash(password);
                const isNotice = document.getElementById('noticeCheckbox').checked;
                
                // 현재 최대 번호 가져오기 (공지 제외)
                const questionsQuery = query(
                    collection(db, 'questions'),
                    where('isNotice', '==', false)
                );
                const querySnapshot = await getDocs(questionsQuery);
                let nextNumber = 1; // 기본값
                
                if (!querySnapshot.empty) {
                    // 클라이언트에서 최대값 계산
                    const numbers = querySnapshot.docs
                        .map(doc => doc.data().postNumber || 0)
                        .filter(num => num > 0);
                    
                    if (numbers.length > 0) {
                        nextNumber = Math.max(...numbers) + 1;
                    }
                }
                
                await addDoc(collection(db, 'questions'), {
                    author: author,
                    title: title,
                    content: content,
                    passwordHash: passwordHash,
                    isNotice: isNotice,
                    postNumber: isNotice ? null : nextNumber, // 공지는 번호 없음
                    createdAt: serverTimestamp(),
                    answered: false,
                    views: 0
                });
                
                // EmailJS 이메일 알림 전송
                try {
                    await emailjs.send(
                        'service_rs8x3kl',  // Service ID
                        'template_vdw1308', // Template ID
                        {
                            author: author,
                            title: title,
                            content: content,
                            time: new Date().toLocaleString('ko-KR', {
                                year: 'numeric',
                                month: '2-digit',
                                day: '2-digit',
                                hour: '2-digit',
                                minute: '2-digit',
                                second: '2-digit',
                                hour12: false
                            }),
                            isNotice: isNotice ? '공지사항' : '일반 질문'
                        }
                    );
                    console.log('이메일 알림 전송 성공!');
                } catch (emailError) {
                    console.log('이메일 알림 전송 실패:', emailError);
                    // 알림 실패해도 글 작성은 성공한 것으로 처리
                }
                
                writeForm.reset();
                document.getElementById('noticeCheckbox').checked = false;
                alert('✅ 등록되었습니다!');
                
                document.getElementById('writeFormContainer').style.display = 'none';
                
            } catch (error) {
                console.error('등록 실패:', error);
                alert('등록에 실패했습니다. 다시 시도해주세요.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '등록하기';
            }
        });
        
        // 질문 수정
        window.editQuestion = async function() {
            if (!currentQuestionId || !currentQuestionData) return;
            
            const password = prompt('비밀번호를 입력하세요:');
            if (!password) return;
            
            try {
                const passwordHash = await simpleHash(password);
                
                if (passwordHash !== currentQuestionData.passwordHash) {
                    alert('❌ 비밀번호가 일치하지 않습니다.');
                    return;
                }
                
                const newTitle = prompt('수정할 제목:', currentQuestionData.title);
                if (newTitle === null) return;
                
                const newContent = prompt('수정할 내용:', currentQuestionData.content);
                if (newContent === null) return;
                
                await updateDoc(doc(db, 'questions', currentQuestionId), {
                    title: newTitle || currentQuestionData.title,
                    content: newContent || currentQuestionData.content
                });
                
                alert('✅ 수정되었습니다!');
                location.reload();
                
            } catch (error) {
                console.error('수정 실패:', error);
                alert('수정에 실패했습니다.');
            }
        };
        
        // 질문 삭제
        window.deleteQuestion = async function() {
            if (!currentQuestionId || !currentQuestionData) return;
            
            const password = prompt('비밀번호를 입력하세요:');
            if (!password) return;
            
            try {
                const passwordHash = await simpleHash(password);
                
                if (passwordHash !== currentQuestionData.passwordHash) {
                    alert('❌ 비밀번호가 일치하지 않습니다.');
                    return;
                }
                
                if (!confirm('정말 삭제하시겠습니까?')) return;
                
                await deleteDoc(doc(db, 'questions', currentQuestionId));
                
                alert('✅ 삭제되었습니다!');
                window.location.href = 'qna.html';
                
            } catch (error) {
                console.error('삭제 실패:', error);
                alert('삭제에 실패했습니다.');
            }
        };
        
        // 답변 추가
        window.addComment = async function() {
            if (!currentQuestionId) return;
            
            const content = document.getElementById('commentInput').value.trim();
            
            if (!content) {
                alert('답변 내용을 입력하세요.');
                return;
            }
            
            // 관리자인 경우
            if (isAdmin && currentUser) {
                try {
                    await addDoc(collection(db, 'questions', currentQuestionId, 'comments'), {
                        content: content,
                        author: '건설업 전문 김세무사',
                        isAdmin: true,
                        createdAt: serverTimestamp()
                    });
                    
                    document.getElementById('commentInput').value = '';
                    alert('✅ 답변이 등록되었습니다!');
                    
                } catch (error) {
                    console.error('답변 등록 실패:', error);
                    alert('답변 등록에 실패했습니다.');
                }
                return;
            }
            
            // 일반 사용자인 경우
            const author = document.getElementById('commentAuthor').value.trim();
            const password = document.getElementById('commentPassword').value.trim();
            
            if (!author || !password) {
                alert('이름과 비밀번호를 입력하세요.');
                return;
            }
            
            if (password.length < 4) {
                alert('비밀번호는 4자리 이상 입력해주세요.');
                return;
            }
            
            try {
                const passwordHash = await simpleHash(password);
                
                await addDoc(collection(db, 'questions', currentQuestionId, 'comments'), {
                    content: content,
                    author: author,
                    passwordHash: passwordHash,
                    isAdmin: false,
                    createdAt: serverTimestamp()
                });
                
                document.getElementById('commentInput').value = '';
                document.getElementById('commentAuthor').value = '';
                document.getElementById('commentPassword').value = '';
                
                alert('✅ 답변이 등록되었습니다!');
                
            } catch (error) {
                console.error('답변 등록 실패:', error);
                alert('답변 등록에 실패했습니다.');
            }
        };
        
        // 답변 수정
        window.editComment = async function(questionId, commentId, storedHash) {
            const password = prompt('비밀번호를 입력하세요:');
            if (!password) return;
            
            try {
                const passwordHash = await simpleHash(password);
                
                if (passwordHash !== storedHash) {
                    alert('❌ 비밀번호가 일치하지 않습니다.');
                    return;
                }
                
                const newContent = prompt('수정할 내용:');
                if (!newContent) return;
                
                await updateDoc(doc(db, 'questions', questionId, 'comments', commentId), {
                    content: newContent
                });
                
                alert('✅ 수정되었습니다!');
                
            } catch (error) {
                console.error('수정 실패:', error);
                alert('수정에 실패했습니다.');
            }
        };
        
        // 답변 삭제
        window.deleteComment = async function(questionId, commentId, storedHash) {
            const password = prompt('비밀번호를 입력하세요:');
            if (!password) return;
            
            try {
                const passwordHash = await simpleHash(password);
                
                if (passwordHash !== storedHash) {
                    alert('❌ 비밀번호가 일치하지 않습니다.');
                    return;
                }
                
                if (!confirm('정말 삭제하시겠습니까?')) return;
                
                await deleteDoc(doc(db, 'questions', questionId, 'comments', commentId));
                
                alert('✅ 삭제되었습니다!');
                
            } catch (error) {
                console.error('삭제 실패:', error);
                alert('삭제에 실패했습니다.');
            }
        };
        
        // 관리자 댓글 삭제 (비밀번호 없이)
        window.adminDeleteComment = async function(questionId, commentId) {
            if (!isAdmin) {
                alert('관리자만 사용할 수 있습니다.');
                return;
            }
            
            if (!confirm('정말 삭제하시겠습니까?')) return;
            
            try {
                await deleteDoc(doc(db, 'questions', questionId, 'comments', commentId));
                alert('✅ 삭제되었습니다!');
            } catch (error) {
                console.error('삭제 실패:', error);
                alert('삭제에 실패했습니다.');
            }
        };
        
        // 질문 버튼 업데이트 (관리자용)
        function updateQuestionActions() {
            const questionActions = document.getElementById('questionActions');
            if (!questionActions) return;
            
            if (isAdmin) {
                questionActions.innerHTML = `
                    <button class="action-btn" onclick="adminDeleteQuestion()">삭제 (관리자)</button>
                `;
            } else {
                questionActions.innerHTML = `
                    <button class="action-btn" onclick="editQuestion()">수정</button>
                    <button class="action-btn" onclick="deleteQuestion()">삭제</button>
                `;
            }
        }
        
        // 관리자 질문 삭제
        window.adminDeleteQuestion = async function() {
            if (!isAdmin) {
                alert('관리자만 사용할 수 있습니다.');
                return;
            }
            
            if (!confirm('정말 삭제하시겠습니까?')) return;
            
            try {
                await deleteDoc(doc(db, 'questions', currentQuestionId));
                alert('✅ 삭제되었습니다!');
                window.location.href = 'qna.html';
            } catch (error) {
                console.error('삭제 실패:', error);
                alert('삭제에 실패했습니다.');
            }
        };
        
        // 햄버거 메뉴는 menu-config.js에서 자동 처리됩니다
    </script>
