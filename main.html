    <style>

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif; line-height: 1.6; color: #333; background-color: #f8f9fa; padding-top: 70px; }
        
        .hamburger-container { position: fixed; top: 0; left: 0; width: 100%; background: white; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .hamburger-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; max-width: 1200px; margin: 0 auto; }
        .hamburger-logo { display: flex; align-items: center; text-decoration: none; flex: 1; }

        .hamburger-line { width: 28px; height: 3px; background: #667eea; border-radius: 2px; transition: all 0.3s ease; }
        .hamburger-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: rgba(0,0,0,0.5); opacity: 0; visibility: hidden; transition: all 0.3s ease; z-index: 998; }
        .hamburger-overlay.active { opacity: 1; visibility: visible; }
        .hamburger-menu { position: fixed; top: 0; right: -100%; width: 100%; max-width: 320px; height: 100vh; background: white; box-shadow: -5px 0 15px rgba(0,0,0,0.2); transition: right 0.3s ease; z-index: 1001; overflow-y: auto; }
        .hamburger-menu.active { right: 0; }
        .hamburger-menu-content { padding: 60px 0 0 0; }
        .hamburger-menu-item { display: flex; align-items: center; gap: 15px; padding: 18px 25px; text-decoration: none; color: #333; font-size: 16px; transition: background 0.2s ease; border-bottom: 1px solid #f0f0f0; }
        .hamburger-menu-item:hover { background: #f8f9fa; }
        .hamburger-menu-item.active { background: #e3f2fd; color: #1976d2; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 60px; }
        .service-card { background: white; border-radius: 12px; padding: 30px 20px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.08); transition: all 0.3s ease; cursor: pointer; text-decoration: none; color: inherit; display: block; }
        .service-card:hover { transform: translateY(-5px); box-shadow: 0 8px 16px rgba(0,0,0,0.15); }
        .service-icon { font-size: 2.5em; margin-bottom: 15px; display: block; }

        .news-section { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 60px; }
        .news-section h2 { font-size: 1.5em; margin-bottom: 8px; color: #2c3e50; }
        .news-section .subtitle { color: #95a5a6; font-size: 0.9em; margin-bottom: 25px; }
        .news-list { list-style: none; }
        .news-item { padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
        .news-item:last-child { border-bottom: none; }
        .news-item a { text-decoration: none; color: inherit; display: flex; justify-content: space-between; align-items: center; transition: all 0.2s ease; }
        .news-item a:hover .news-title { color: #3498db; }
        .news-title { font-size: 0.95em; color: #2c3e50; flex: 1; padding-right: 15px; }
        .news-meta { display: flex; align-items: center; gap: 8px; white-space: nowrap; font-size: 0.85em; color: #95a5a6; }
        .loading { text-align: center; padding: 40px; color: #95a5a6; }
        
        footer { background: #2c3e50; color: white; padding: 20px; margin-top: 60px; }
        footer .container { text-align: center; color: #95a5a6; font-size: 13px; }
        
        @media (max-width: 768px) {
            .news-item a { flex-direction: column; align-items: flex-start; }
            .news-title { margin-bottom: 5px; }
        }

</head>
<body>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            renderHamburgerMenu('main');
        });
    </script>

    <div class="container">
        <div class="services-grid">
            <a href="criteria.html" class="service-card"><span class="service-icon">📋</span><h3>건설업 등록 가이드</h3></a>
            <a href="diagnosis-guide.html" class="service-card"><span class="service-icon">🏥</span><h3>건설업 기업진단 가이드</h3></a>

            <a href="https://blog.naver.com/kyr_tax" target="_blank" class="service-card"><span class="service-icon">📰</span><h3>기업진단센터 블로그</h3></a>
        </div>

        <div class="news-section">
            <h2>📰 건설업 뉴스</h2>
            <p class="subtitle">실시간 건설업 관련 뉴스</p>
            <div id="newsContainer"><div class="loading">뉴스를 불러오는 중...</div></div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>© 2025 김용래세무사사무소 기업진단센터. All rights reserved.</p>
            <p style="margin-top: 10px;">건설업 기업진단 전문 | 재무관리상태진단보고서 | 건설세무 상담</p>
        </div>
    </footer>

    <script>
        const NAVER_CLIENT_ID = 'UVU4OwaLbJt_pmKF9zeV';
        const NAVER_CLIENT_SECRET = 'GqNvLpe3Yi';
        const SEARCH_KEYWORD = '건설업';
        
        async function loadNews() {
            const newsContainer = document.getElementById('newsContainer');
            
            try {
                // corsproxy.io 사용 (무료 CORS 프록시)
                const API_URL = `https://openapi.naver.com/v1/search/news.json?query=${encodeURIComponent(SEARCH_KEYWORD)}&display=10&sort=date`;
                const PROXY_URL = `https://corsproxy.io/?${encodeURIComponent(API_URL)}`;
                
                const response = await fetch(PROXY_URL, {
                    method: 'GET',
                    headers: {
                        'X-Naver-Client-Id': NAVER_CLIENT_ID,
                        'X-Naver-Client-Secret': NAVER_CLIENT_SECRET
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.items && data.items.length > 0) {
                    displayNews(data.items);
                } else {
                    throw new Error('뉴스 없음');
                }
                
            } catch (error) {
                console.error('뉴스 에러:', error);
                newsContainer.innerHTML = `
                    <p style="text-align: center; padding: 20px; color: #7f8c8d;">
                        뉴스를 불러올 수 없습니다. 
                        <a href="https://news.naver.com/main/search.naver?query=건설업" target="_blank" style="color: #3498db;">
                            네이버에서 보기 →
                        </a>
                    </p>
                `;
            }
        }
        
        function displayNews(newsItems) {
            const newsContainer = document.getElementById('newsContainer');
            
            const newsHTML = `
                <ul class="news-list">
                    ${newsItems.map(item => {
                        const title = item.title.replace(/<[^>]*>/g, '');
                        const pubDate = new Date(item.pubDate);
                        const formattedDate = `${String(pubDate.getMonth() + 1).padStart(2, '0')}-${String(pubDate.getDate()).padStart(2, '0')} ${String(pubDate.getHours()).padStart(2, '0')}:${String(pubDate.getMinutes()).padStart(2, '0')}`;
                        
                        return `
                            <li class="news-item">
                                <a href="${item.originallink}" target="_blank" rel="noopener noreferrer">
                                    <span class="news-title">• ${title}</span>
                                    <span class="news-meta">
                                        <span class="news-date">${formattedDate}</span>
                                    </span>
                                </a>
                            </li>
                        `;
                    }).join('')}
                </ul>
                <div style="text-align: center; margin-top: 20px; padding-top: 20px; border-top: 1px solid #f0f0f0;">
                    <p style="font-size: 0.85em; color: #95a5a6;">
                        💡 네이버 검색 API 제공 (25,000건/일 무료)
                    </p>
                </div>
            `;
            
            newsContainer.innerHTML = newsHTML;
        }
        
        document.addEventListener('DOMContentLoaded', loadNews);
    </script>
</body>
</html>
