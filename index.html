<html lang="ko">
<head>

    <!-- 공통 메뉴 설정 로드 -->
    <script src="menu-config.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif; line-height: 1.6; color: #333; background-color: #f8f9fa; padding-top: 70px; }
        
        .hamburger-container { position: fixed; top: 0; left: 0; width: 100%; background: white; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .hamburger-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; max-width: 1200px; margin: 0 auto; }
        .hamburger-logo { display: flex; align-items: center; text-decoration: none; flex: 1; }
        .hamburger-button { width: 40px; height: 40px; background: none; border: none; cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px; }
        .hamburger-line { width: 28px; height: 3px; background: #667eea; border-radius: 2px; transition: all 0.3s ease; }
        .hamburger-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: rgba(0,0,0,0.5); opacity: 0; visibility: hidden; transition: all 0.3s ease; z-index: 998; }
        .hamburger-overlay.active { opacity: 1; visibility: visible; }
        .hamburger-menu { position: fixed; top: 0; right: -100%; width: 100%; max-width: 320px; height: 100vh; background: white; box-shadow: -5px 0 15px rgba(0,0,0,0.2); transition: right 0.3s ease; z-index: 1001; overflow-y: auto; }
        .hamburger-menu.active { right: 0; }
        .hamburger-menu-content { padding: 60px 0 0 0; }
        .hamburger-menu-item { display: flex; align-items: center; gap: 15px; padding: 18px 25px; text-decoration: none; color: #333; font-size: 16px; transition: background 0.2s ease; border-bottom: 1px solid #f0f0f0; }
        .hamburger-menu-item:hover { background: #f8f9fa; }
        .hamburger-menu-item.active { background: #e3f2fd; color: #1976d2; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 60px; }
        .service-card { background: white; border-radius: 12px; padding: 30px 20px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.08); transition: all 0.3s ease; cursor: pointer; text-decoration: none; color: inherit; display: block; }
        .service-card:hover { transform: translateY(-5px); box-shadow: 0 8px 16px rgba(0,0,0,0.15); }
        .service-icon { font-size: 2.5em; margin-bottom: 15px; display: block; }
        .service-card h3 { font-size: 1em; color: #2c3e50; font-weight: 600; }
        
        /* 뉴스 미리보기 섹션 */
        .news-preview-section { max-width: 1200px; margin: 0 auto 60px; padding: 0 20px; }
        .news-preview-box { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .news-preview-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .news-preview-header h2 { font-size: 1.5em; color: #2c3e50; margin: 0; }
        .view-all-btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 600; transition: all 0.3s ease; display: inline-block; }
        .view-all-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4); }
        .news-preview-subtitle { color: #7f8c8d; margin-bottom: 25px; font-size: 0.95em; }
        
        .news-preview-item { padding: 15px 0; border-bottom: 1px solid #f0f0f0; transition: all 0.2s ease; }
        .news-preview-item:last-child { border-bottom: none; }
        .news-preview-item:hover { background: #f8f9fa; padding-left: 10px; }
        .news-preview-title { font-size: 1em; color: #2c3e50; text-decoration: none; display: block; margin-bottom: 8px; font-weight: 500; }
        .news-preview-title:hover { color: #667eea; }
        .news-preview-meta { font-size: 0.85em; color: #95a5a6; }
        .news-preview-source { font-weight: 600; color: #7f8c8d; margin-right: 8px; }
        
        .loading-spinner { text-align: center; padding: 40px; color: #95a5a6; }
        .spinner { display: inline-block; width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #667eea; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        footer { background: #2c3e50; color: white; padding: 20px; margin-top: 60px; }
        footer .container { text-align: center; color: #95a5a6; font-size: 13px; }
        
        @media (max-width: 768px) {
            .news-preview-header { flex-direction: column; align-items: flex-start; gap: 15px; }
            .view-all-btn { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            renderHamburgerMenu('main');
        });
    </script>

    <div class="container">
        <!-- 서비스 카드 -->
        <div class="services-grid">
            <a href="criteria.html" class="service-card"><span class="service-icon">📋</span><h3>건설업 등록 가이드</h3></a>
            <a href="diagnosis-guide.html" class="service-card"><span class="service-icon">🏥</span><h3>건설업 기업진단 가이드</h3></a>
            <a href="index.html" class="service-card"><span class="service-icon">🧮</span><h3>건설업 실질자본 간이계산기</h3></a>
            <a href="regulations.html" class="service-card"><span class="service-icon">📊</span><h3>건설업체 기업진단지침</h3></a>
            <a href="qna.html" class="service-card"><span class="service-icon">💬</span><h3>Q&A 게시판</h3></a>
            <a href="https://blog.naver.com/kyr_tax" target="_blank" class="service-card"><span class="service-icon">📰</span><h3>기업진단센터 블로그</h3></a>
        </div>
    </div>

    <!-- 뉴스 미리보기 섹션 -->
    <section class="news-preview-section">
        <div class="news-preview-box">
            <div class="news-preview-header">
                <h2>📰 건설업 최신 뉴스</h2>
                <a href="news.html" class="view-all-btn">전체 보기 →</a>
            </div>
            
            <p class="news-preview-subtitle">실시간 건설업계 주요 뉴스</p>
            
            <div id="newsPreview">
                <div class="loading-spinner">
                    <div class="spinner"></div>
                    <p style="margin-top: 15px;">뉴스를 불러오는 중...</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>© 2025 김용래세무사사무소 기업진단센터. All rights reserved.</p>
            <p style="margin-top: 10px;">건설업 기업진단 전문 | 재무관리상태진단보고서 | 건설세무 상담</p>
        </div>
    </footer>

    <script>
        // 뉴스 미리보기 로딩
        async function loadNewsPreview() {
            const container = document.getElementById('newsPreview');
            
            try {
                // Vercel API 호출
                const response = await fetch('/api/naver-news');
                
                if (!response.ok) {
                    throw new Error('API 호출 실패');
                }
                
                const data = await response.json();
                
                if (data.items && data.items.length > 0) {
                    displayNewsPreview(data.items);
                } else {
                    throw new Error('뉴스 없음');
                }
                
            } catch (error) {
                console.error('뉴스 로딩 에러:', error);
                container.innerHTML = `
                    <div style="text-align: center; padding: 20px;">
                        <p style="color: #7f8c8d; margin-bottom: 10px;">뉴스를 불러올 수 없습니다.</p>
                        <a href="https://news.naver.com/main/search.naver?query=건설업" target="_blank" 
                           style="color: #667eea; text-decoration: underline;">
                            네이버에서 보기 →
                        </a>
                    </div>
                `;
            }
        }
        
        function displayNewsPreview(newsItems) {
            const container = document.getElementById('newsPreview');
            const now = new Date();
            
            // 최대 5개만 표시
            const items = newsItems.slice(0, 5);
            
            const html = items.map(item => {
                const title = item.title.replace(/<[^>]*>/g, '');
                const pubDate = new Date(item.pubDate);
                const diffMinutes = Math.floor((now - pubDate) / 1000 / 60);
                
                let timeText;
                if (diffMinutes < 60) {
                    timeText = `${diffMinutes}분 전`;
                } else if (diffMinutes < 1440) {
                    timeText = `${Math.floor(diffMinutes / 60)}시간 전`;
                } else {
                    timeText = `${Math.floor(diffMinutes / 1440)}일 전`;
                }
                
                return `
                    <div class="news-preview-item">
                        <a href="${item.originallink}" target="_blank" class="news-preview-title">
                            • ${title}
                        </a>
                        <div class="news-preview-meta">
                            <span class="news-preview-source">건설뉴스</span>
                            <span>${timeText}</span>
                        </div>
                    </div>
                `;
            }).join('');
            
            container.innerHTML = html;
        }
        
        // 페이지 로드 시 뉴스 미리보기 실행
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(loadNewsPreview, 500);
        });
    </script>
</body>
</html>
